# 선수 풀과 테마 (content/themes.py). 매일 테마와 선수를 가중치대로 무작위로 뽑는다.
# 숫자(연봉·기록)는 여기 적지 않는다. 글 쓰는 날 뉴스에서 새로 모은다 (연봉 보도가 없으면 다른 선수로 넘어감).
# weight: 뽑힐 확률 가중치. 데이터랩 추정 검색량 기준 (reports/2026-09-29-주제-비교-검토.md 5장):
#   3 = 월 40만 이상, 2 = 월 10만~20만, 1 = 그 밖의 인기 선수 (미측정, 운영하며 조정)
# 운영하며 조회수가 잘 나온 종목·선수·테마의 가중치를 올려 타겟을 좁힌다 (2026-09-29 대표 결정).
# en·number: 썸네일·클립의 유니폼 등판 그림 (content/jersey.py). 등번호는 2026-09-30 보도로 확인한 값.
#   이적·번호 변경이 있으면 여기만 고친다 (팀도 같이). 확인 못 한 번호는 비워 두면 이름만 나온다.

