# 건강 블로그(갱년기 축) 키워드 큐 — 매일 예약작업/수동 생성이 위에서부터 2개씩 뽑아 글 생성 (대표 2026-10-18)
# 축: 갱년기. 단, '여자 갱년기 증상'처럼 넓은 주제는 지양(허브글 1개면 충분).
# **갱년기 안에서 좁은 세부 키워드**로 간다. 독자 3부류에 맞춘다 (대표 2026-10-18):
#   seg1 = 이미 갱년기인 사람 → 지금 겪는 증상 '완화·관리 how-to'
#   seg2 = 갱년기를 앞둔 사람(40대 초중반) → '준비·예방'
#   seg3 = 갱년기인지 의심 중인 사람 → '자가 점검·감별(이 증상이 갱년기일까)'
# 정보형 중심, 영양제 효능 단정·제품 홍보 금지. 숫자·효능은 공식 의학기관 출처로. slug는 영문/숫자.
# 규칙: pending에서 초안(reports/건강글-초안/<slug>.md) 없는 주제를 위에서부터 2개 생성→done 이동. pending<6이면 세 부류 고루 롱테일 보충.
pending:
