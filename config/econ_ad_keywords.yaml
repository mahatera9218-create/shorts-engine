# 경제 블로그: 광고주 유형별 단가 조사 (대표 지시 2026-10-04 "단가 조사 먼저")
# 묶음 = 미래 광고주 유형. 중간 입찰가 = 그 광고주가 그 독자의 클릭 1번에 내는 돈의 대략값.
# 이 파일을 고쳐 main에 올리면 ad-value.yml이 재고 reports/광고/광고단가-경제-<날짜>.md에 남긴다.
groups:
  us_stock:
    name: 증권사 · 미국주식 시작하는 독자
    fit: 증권사 (해외주식 계좌·수수료)
    keywords: [미국주식, 미국주식시작, 해외주식수수료, 해외주식계좌개설, 미국주식세금, 미국배당주, 미국ETF, 나스닥ETF]
  kr_stock:
    name: 증권사 · 국내주식 시작하는 독자
    fit: 증권사 (계좌 개설)
    keywords: [주식계좌개설, 주식초보, 주식시작하는법, 증권사추천, ISA계좌, 삼성전자주가]
  market_daily:
    name: 시황 · 매일 오는 단골
    fit: 단골 (활성 방문자)
    keywords: [미국증시, 뉴욕증시, 나스닥, 오늘증시, 증시전망, 코스피전망]
  gold:
    name: 은행·금 투자 서비스 · 안전자산 독자
    fit: 은행·금 투자 서비스
    keywords: [금시세, 금값, 금투자, 골드뱅킹, 금통장, 금ETF, 금테크, 골드바]
  crypto:
    name: 가상자산 · 코인 독자
    fit: 거래소 (광고 규제 확인 필요)
    keywords: [비트코인, 비트코인시세, 코인거래소, 업비트, 이더리움, 코인투자]
  saving:
    name: 핀테크·은행 · 예적금·금리 독자
    fit: 핀테크·은행
    keywords: [적금추천, 파킹통장, 예금금리, 고금리적금, CMA통장, 금리인하]
  edu:
    name: 투자 교육·도서 · 공부하는 독자
    fit: 교육·출판
    keywords: [주식공부, 경제공부, 투자공부, 재테크책, 주식책추천]
  tax:
    name: 세무 · 투자 세금 독자 (계절성)
    fit: 세무·증권사
    keywords: [해외주식양도세, 배당소득세, 금융소득종합과세, 해외주식세금신고]
  avoid:
    name: "참고: 우리가 안 하는 영역 (광고주 기피·권유)"
    fit: 목표 아님
    keywords: [급등주, 주식리딩방, 코인추천, 주식담보대출]
