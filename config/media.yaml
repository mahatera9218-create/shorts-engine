# 영상 제작 설정 (content/produce.py). 대표 결정 2026-09-30: 클립·쇼츠에 실사 배경·효과음·선수 사진·AI 목소리.
sound: false             # 대표 결정 2026-09-30: 목소리·효과음·BGM 없이 영상만 (음악은 각 앱의 인기 음원). true면 효과음·목소리
tts:                      # 구글 클라우드 Text-to-Speech (키: GitHub Secrets GOOGLE_TTS_API_KEY, 월 무료 한도 안)
  voice: ko-KR-Chirp3-HD-Charon   # 안 되면 fallback으로
  fallback: ko-KR-Neural2-C
  rate: 1.12              # 말 빠르기 (쇼츠는 빠른 편이 끝까지 본다)
