# 광고 단가 측정 (대표 질문 2026-09-30: "우리 주제에는 무슨 광고가 달리고, 어떤 광고를 기대하며 글을 짜나?")
# 애드포스트는 문맥 광고: 글의 주제·단어에 맞는 광고가 붙는다. 그래서 글이 부를 수 있는 광고 묶음별로
# 광고주가 실제로 돈을 쓰는지(중간 입찰가 = 클릭 단가 대략값, 경쟁도, 노출 광고 수)를 잰다.
# 이 파일을 고쳐 main에 올리면 워크플로(ad-value.yml)가 자동으로 재고 reports/광고/에 남긴다.
# 도박(토토·배당)·대출 권유·건강 효능처럼 우리가 쓰지 않는 영역은 광고가 비싸도 목표로 삼지 않는다.
groups:
  sports_core:
    name: 스포츠 본 주제 (지금 글이 자연스럽게 부르는 광고)
    fit: 지금
    keywords: [프로야구, 메이저리그, 해외축구, 야구중계, 축구중계, 야구선수연봉]
  sports_goods:
    name: 스포츠 용품·유니폼
    fit: 지금 (유니폼 등판·종목 단어)
    keywords: [야구유니폼, 야구글러브, 축구화, 축구유니폼, 골프채, 골프공]
  tickets:
    name: 경기 관람·여행
    fit: 가능 (직관 가격 비교 테마를 만들면)
    keywords: [야구예매, 프로야구티켓, 해외축구직관, 메이저리그직관]
  car:
    name: 자동차 (생활 물가 테마의 차값 비교)
    fit: 생활 물가 테마
    keywords: [신차할인, 자동차리스, 장기렌트카, 중고차시세, 아반떼가격, 테슬라모델Y]
  home:
    name: 부동산 (생활 물가 테마의 아파트값 비교)
    fit: 생활 물가 테마 (가격 사실만, 투자 권유 금지)
    keywords: [아파트매매, 아파트분양, 아파트시세, 부동산시세]
  money:
    name: 연봉·세금 (연봉을 세후로 바꾸면)
    fit: 가능 (연봉 실수령액 계산 테마를 만들면, 재테크 권유 금지)
    keywords: [연봉실수령액, 연봉계산기, 종합소득세, 연말정산]
  travel:
    name: 여행 (소속팀 도시 직관 여행, config/ideas.yaml)
    fit: 후보 (데이터 출처 확인 후)
    keywords: [항공권, 호텔예약, 해외여행, 샌프란시스코여행, LA여행, 마드리드여행, 뮌헨여행, 일본여행]
  home_city:
    name: 연고지 아파트 (소속팀 연고지 아파트값)
    fit: 후보 (지역 평균 매매가 보도로)
    keywords: [광주아파트, 대전아파트, 대구아파트, 인천아파트, 부산아파트, 수원아파트]
