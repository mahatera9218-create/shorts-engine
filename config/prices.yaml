# 대표 결정 (2026-09-30): 집값은 많이 검색하는 지역·단지, 차값은 많이 검색하는 국산·수입 차종 위주.
#   → candidates의 검색량을 market/volume.py로 재고(워크플로 '생활 물가 검색량'), 상위만 items에 넣는다.
#   group: home(집값) · car_kr(국산차) · car_import(수입차), weight: 월 검색량 (클수록 자주 뽑힘)
