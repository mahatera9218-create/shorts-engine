# 블로그 벤치마크 (2026-09-30): 겹치는 주제에서 잘 되는 블로그를 우리 블로그와 같은 잣대로 잰다.
# - 통로: 각 블로그의 공개 RSS + 네이버 공식 블로그 검색 API. 글 본문은 받지 않는다.
# - 남의 제목·문장은 보고서에 옮기지 않는다. 숫자(빈도·시각·길이·순위)와 낱말 빈도만 남긴다.
# - 대상을 더하려면 targets에 한 줄 추가하고 main에 올리면 자동으로 다시 돈다.
targets:
  - {id: quainter, name: 양찬군주, why: "주제가 겹치고 대부분 글이 상위 노출 (대표 관찰, 2026-09-30 방문자 약 1,200)"}
query_suffix: 연봉      # 겹침 검사 검색어 = 선수 이름 + 이 말 (config/players.yaml 선수 전원)
top: 10                 # '상위'로 볼 순위
