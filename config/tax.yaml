# 연봉 세금 테마 (대표 결정 2026-09-30). 세율은 국세청 종합소득세 세율표 (2026년 귀속까지 같은 구간).
# 프로 선수 연봉은 사업소득: 구단이 줄 때 3.3%(소득세 3% + 지방소득세 0.3%)를 떼고, 5월에 종합소득세를 신고한다.
# 실제 세금은 필요경비·공제에 따라 달라 알 수 없다. 글에는 확실한 것(3.3% 원천징수)과
# "경비·공제를 하나도 안 뺐을 때의 상한"만 쓴다. 실제 세금이라고 쓰지 않는다.
source: "국세청 종합소득세 세율 https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7667&mi=2227"
withholding: 0.033          # 사업소득 원천징수 3% + 지방소득세 0.3%
withholding_source: "프로야구 선수 연봉 3.3% 원천징수 보도 https://www.kmib.co.kr/article/view.asp?arcid=0008204275"
local_rate: 0.10            # 지방소득세 = 소득세의 10%
brackets:                   # [과세표준 상한(원), 세율, 누진공제(원)]
  - [14000000, 0.06, 0]
  - [50000000, 0.15, 1260000]
  - [88000000, 0.24, 5760000]
  - [150000000, 0.35, 15440000]
  - [300000000, 0.38, 19940000]
  - [500000000, 0.40, 25940000]
  - [1000000000, 0.42, 35940000]
  - [null, 0.45, 65940000]
