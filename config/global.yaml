# 시장조사 설정 (설계서 0.3, 0.4, 14장). 점수 계산은 코드로만 한다.

collect:
  related_per_seed: 20        # 씨앗마다 검색량 상위 연관 키워드 몇 개를 남길지
  min_monthly_volume: 300     # 월간 검색량(PC+모바일)이 이보다 작으면 버림
  blog_recent_n: 100          # 최신순으로 몇 개 글을 받아 '최근 30일 새 글 수'를 잴지 (API 최대 100)
  relevance_filter: true      # 씨앗과 두 글자도 안 겹치는 연관 키워드는 뺌 (seeds.yaml include_terms로 넓힐 수 있음)
  trend_months: 24            # 데이터랩 기간. 추세는 1년 전 같은 달과 비교하므로 15개월 이상 필요

youtube:
  top_keywords: 10            # 점수 상위 몇 개만 유튜브에서 조회 (규칙 5: 한도)
  videos_per_keyword: 10
  daily_quota: 10000          # 공식 기본 한도
  quota_budget: 1500          # 이 실행에서 쓸 최대 단위 (검색 1회 100, 영상·채널 조회 1)
  outlier_ratio: 3.0          # 조회수 ÷ 구독자 수가 이 이상이면 이상치
  region: KR
  language: ko

# 틈새 점수 = 수요^a × 가치^b × 이길가능성^c × 제휴가치^d ÷ 공급^e  (0.3)
# 각 축은 0~1로 정규화한 뒤 지수(가중치)를 적용한다. 운영 데이터로 보정한다 (0.6).
weights:
  demand: 1.0
  value: 1.0
  win: 1.0
  affiliate: 0.5
  supply: 1.0

# 규제·민감 업종 (0.3). 포함되면 점수와 별도로 표시하고, 법률 검토 전에는 진입하지 않는다.
regulated_terms:
  금융: [대출, 금리, 적금, 예금, 주식, 코인, 비트코인, 펀드, 투자, 카드론, 신용카드, 캐피탈, 할부, 자동차리스, 리스료, 리스승계, 장기렌트]
  보험: [보험, 보험료, 실비, 실손]
  의료: [병원, 치료, 시술, 의약품, 약국, 처방, 한의원, 성형, 탈모, 다이어트약, 효능]
  법률: [변호사, 소송, 이혼, 개인회생, 파산, 고소]
  도박: [토토, 프로토, 배팅, 베팅, 승부예측, 배당률]
  사생활: [여자친구, 남자친구, 열애, 결혼, 아내, 와이프, 남편, 논란, 인성, 루머]   # 선수·인물 사생활은 다루지 않음 (명예훼손·짜깁기 위험)

# 광고 키워드 도구가 못 보는 인물·스포츠 키워드의 검색량 추정 (2026-09-29).
# 기준 키워드는 검색광고 도구에서 절대 검색량이 나오고 1년 내내 꾸준한 것으로 고른다.
demand_probe:
  anchor: 휘발유가격

# 자동 글쓰기 모델 (14.1: 계산·수집은 코드, 숫자 뽑기는 싼 설정, 글쓰기는 중급 모델).
# 글 품질이 모자라면 write.model만 claude-opus-5-5로 올린다 (편당 비용 약 2배).
llm:
  extract: {model: claude-sonnet-5-5, effort: low}
  write: {model: claude-sonnet-5-5, effort: medium}
  cost_cap_usd_per_post: 1.0   # 편당 상한 (14.2-9). 넘으면 고쳐 쓰기를 멈추고 '확인 필요'로 남긴다

report:
  memos: 3                    # 투자 메모 개수
  area_score_top: 5           # 주제 점수 = 규제 제외 상위 몇 개 키워드의 평균
  representative_keywords: 10 # 메모의 대표 키워드 수 (market-research-memo 스킬 양식)

# 판정 제안 (market-research-memo 스킬의 판정 기준 중 코드로 잴 수 있는 것). 최종 판정은 Claude.
verdict:
  declining_trend: -0.2       # 상위 키워드 평균 추세가 이 이하면 '수요 하락' → 제외
  crowded_monthly_posts: 3000 # 월 새 글이 이만큼이면 이길 가능성 바닥, 상위 키워드 중앙값이 이 이상이면 '최근 글로 꽉 참' → 제외 (초기 추정값, 운영 데이터로 보정)
  low_win: 0.3                # 이길 가능성 평균이 이보다 낮으면 보류

# 브랜드 단독·오타 등 빼고 싶은 키워드 (정확히 같은 키워드만 뺀다). 스킬 절차 1.
exclude_keywords: []

# 네이버 API 주소.
# 검색광고 API는 공식 저장소(naver/searchad-apidoc) 기준.
# API HUB 주소는 공식 문서(guide.ncloud-docs.com)를 이 작업 환경에서 열 수 없어
# 검색 결과로만 잡았고, 2026-09-29 첫 실제 실행에서 동작을 확인했다.
endpoints:
  naver_ad_base: https://api.searchad.naver.com
  naver_hub:
    verified: true   # 2026-09-29 첫 실행에서 블로그 검색·검색어 트렌드 정상 응답 확인 (쇼핑 인사이트는 미확인)
    base: https://naverapihub.apigw.ntruss.com
    blog_search: /search/v1/blog
    shop_search: /search/v1/shop   # 쇼핑 검색 (2026-10-08 추가, 블로그·뉴스·이미지와 같은 규칙으로 추정 — 첫 실행에서 확인)
    news_search: /search/v1/news   # 블로그 검색과 같은 규칙으로 추정 (첫 실행에서 확인 필요)
    search_trend: /search-trend/v1/search
    # 쇼핑 인사이트 분야별 트렌드. HUB 경로 미확인(추정). seeds.yaml에 카테고리 코드가 있을 때만 호출한다.
    shopping_category: /shopping/v1/categories
