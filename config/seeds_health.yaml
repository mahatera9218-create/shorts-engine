# 건강 블로그(3번째) 축 후보 씨앗 — 어느 축이 검색량 크고 틈새인지 조사용 (대표 2026-10-18)
# 전략: 건강은 홈판 의존보다 '검색 유입을 안정적으로 쌓는' 버팀목. (DECISIONS 2026-10-18)
# 조사: 네이버 검색광고 월간 검색량 + API HUB 블로그 문서 수(경쟁) → 틈새 점수. (market.run --seeds seeds_health.yaml)
# 좁은 축 하나로 시작할 것이므로, 점수 상위 1개 축을 골라 운영 시작한다.
# affiliate: 제휴 가치 사전값(1~5, 가정). 건강기능식품 제휴가 자연스러운 축이 높음. 특정 브랜드 홍보는 금지(CLAUDE.md).
