# 자동 글쓰기 공통 설정 (content/autopost.py). 선수·테마는 config/players.yaml에서 매일 무작위로 뽑는다 (2026-09-29).
# 숫자는 여기 적지 않는다. 글 쓰는 날 뉴스 검색으로 새로 모으고, 출처끼리 다르면 규칙으로 정한다 (DECISIONS 숫자 충돌 규칙).

blog: sports-money          # config/blogs.yaml의 id
daily_limit: 1              # 하루 최대 편수 (대량 발행 금지)
max_revisions: 2            # 검사 미통과 시 Claude에게 고쳐 달라고 하는 최대 횟수

# 글마다 쓰는 고정 숫자 (공식 출처). 바뀌면 여기만 고친다.
constants:
  min_wage_monthly_krw: 2156880
  min_wage_label: "2026 최저임금 시급 10,320원 × 월 209시간"
  min_wage_source: "고용노동부 https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=18144"

fx_query: 원달러 환율 마감   # 달러 연봉일 때 환율을 뉴스에서 뽑는다

