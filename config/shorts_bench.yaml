# 쇼츠 벤치마크 (2026-09-30 대표 요청): 한국에서 잘 되는 스포츠 돈 쇼츠의 숫자(조회수·길이·제목·구독자)를 본다.
# 이 파일을 고쳐 main에 올리면 자동 실행 → reports/쇼츠-벤치마크/<날짜>.md
# 유튜브 공식 API(YOUTUBE_API_KEY)로 메타데이터만 읽는다. 남의 영상·썸네일은 내려받지 않는다.
# 쿼터: 검색 1번 100단위 → 검색어 12개 ≈ 1,300단위 (무료 하루 10,000).
region: KR
language: ko
per_query: 25          # 검색어마다 조회수 순 상위 몇 개
max_seconds: 180       # 쇼츠 길이 상한 (유튜브 쇼츠는 최대 3분)
published_days: 365    # 최근 1년 안에 올린 영상만
queries:
  - 야구 연봉
  - 선수 연봉
  - 선수 몸값
  - 연봉 순위
  - 메이저리그 연봉
  - KBO 연봉
  - 축구 선수 연봉
  - NBA 연봉
  - 골프 상금
  - 오타니 연봉
  - 이정후 연봉
  - 손흥민 연봉
