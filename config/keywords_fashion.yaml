# 캐시미어 다이어리(패션) 키워드 점수 (대표 결정 2026-10-05). content/econ_score.py
editor: >-
  너는 여성 패션 블로그 편집장이다. 한국 여성 독자가 오늘 네이버에서 찾아볼 '연예인 + 아이템' 패션 키워드(가방·코트·재킷·신발·시계·주얼리·데일리룩)를 고른다.
  브랜드·제품을 알 수 있는 화제를 우선한다. 사생활 추측·외모 비하는 뺀다. 줄에 없는 주제를 지어내지 않는다. 키워드는 '연예인 이름 + 아이템'(예: 김희애 가방, 윤아 코트).
  core(검색량을 잴 말)는 사람들이 실제로 많이 치는 짧은 말로: '연예인 이름 + 아이템 종류'(예: 카리나 가방) 또는 '브랜드 + 아이템'(예: 미우미우 가방) 중 더 많이 찾을 쪽. 낯선 브랜드 이름이나 긴 상품명은 core에 넣지 않는다.
  여러 출처(연예뉴스·블로거·Grok)에 함께 나온 인물·아이템을 우선 묶는다. 블로거 줄(B)은 셀럽 패션 블로거가 이미 고른 주제라 가장 믿을 만하다 — 제목·요약에서 인물·아이템을 뽑고,
  브랜드·가격이 보이면 why에 적는다(예: "수지 원피스 · 브랜드 OO · 465만원"). 협찬·광고 글, 맛집·부업 등 패션이 아닌 글은 뺀다.
grok_topic: >-
  한국 여성들이 이야기하는 연예인 패션 화제(누가 어떤 가방·코트·재킷·신발·시계를 입고 들었는지, 공항패션·드라마 속 의상·행사 의상). 브랜드·제품이 알려진 것 우선.
  네이버에서 이름만 쳐도 많이 찾는 톱배우·인기 아이돌·화제의 방송 출연자 위주로, 한 사람에 몰리지 않게 여러 인물로
areas: [가방, 의류, 신발, 시계·주얼리, 데일리룩, 드라마 패션]
source_points: {대표: 15, 캡처: 15, Grok: 8, 블로거새글: 9, 블로거: 6, 국내뉴스: 3, 인기종목: 8, 급상승: 8}
caps: {국내뉴스: 12, 블로거: 18, 블로거새글: 27}
weights: {급상승: 23, 뉴스: 16, 출처: 11, 블로거: 25, 네이버: 15, 검색: 25}   # 큰 구조 화제성(급상승23+뉴스16+출처11=50):최신성(블로거 우선+어사이드, 상한25):수요(검색25) = 2:1:1 (대표 결정 2026-10-10)
blogger_full: 2    # 서로 다른 블로거 2명이면 최신성 블로거 만점 (패션은 겹침이 적어 문턱 낮게 유지, 1명13·2명+25, 대표 지시 2026-10-10). 같은 블로거 반복 무시
fresh_cap: 25      # 최신성 상한
min_score: 30      # 도우미에 보여 줄 최저 점수 (경제 50). 블로거 화제는 검색량이 적어 점수가 낮게 나옴 (2026-10-06)
fresh_full: 4       # 최근 6시간 기사 4건이면 최신 만점
news_full: 20       # 점수 만점 기준: 24시간 기사 20건이면 뉴스 만점 (경제는 100건)
vol_full: 100000    # 월 검색 10만이면 검색 만점 (경제는 100만) — 패션 검색량에 맞춤 (2026-10-06)
grok_count: 15   # Grok에게 받을 화제 수 (경제 8, 패션은 줄이 적어 15, 2026-10-06)
# 뉴스 검색어(news_queries)는 뺌 (대표 결정 2026-10-11): 네이버 검색 API 결과를 AI에 넣는 건 특약 위반이라. 패션 화제는 블로거 RSS·Grok·연예 RSS·급상승으로
product_bonus: 15   # 줄에 브랜드·제품명·가격이 이미 나온 주제에 +15점 (100점 위로는 안 넘음, 대표 결정 2026-10-08 '주제 고르기 강화')
