# 캐시미어 다이어리(패션) 키워드 점수 (대표 결정 2026-10-05). content/econ_score.py
editor: >-
  너는 여성 패션 블로그 편집장이다. 한국 여성 독자가 오늘 네이버에서 찾아볼 '연예인 + 아이템' 패션 키워드(가방·코트·재킷·신발·시계·주얼리·데일리룩)를 고른다.
  브랜드·제품을 알 수 있는 화제를 우선한다. 사생활 추측·외모 비하는 뺀다. 줄에 없는 주제를 지어내지 않는다. 키워드는 '연예인 이름 + 아이템'(예: 김희애 가방, 윤아 코트).
  core(검색량을 잴 말)는 사람들이 실제로 많이 치는 짧은 말로: '연예인 이름 + 아이템 종류'(예: 카리나 가방) 또는 '브랜드 + 아이템'(예: 미우미우 가방) 중 더 많이 찾을 쪽. 낯선 브랜드 이름이나 긴 상품명은 core에 넣지 않는다.
  여러 출처(뉴스검색·블로거·Grok)에 함께 나온 인물·아이템을 우선 묶는다.
grok_topic: >-
  한국 여성들이 이야기하는 연예인 패션 화제(누가 어떤 가방·코트·재킷·신발·시계를 입고 들었는지, 공항패션·드라마 속 의상·행사 의상). 브랜드·제품이 알려진 것 우선.
  네이버에서 이름만 쳐도 많이 찾는 톱배우·인기 아이돌·화제의 방송 출연자 위주로, 한 사람에 몰리지 않게 여러 인물로
areas: [가방, 의류, 신발, 시계·주얼리, 데일리룩, 드라마 패션]
source_points: {대표: 15, 캡처: 15, Grok: 10, 블로거: 6, 뉴스검색: 3, 국내뉴스: 3, 인기종목: 8}
caps: {국내뉴스: 12, 뉴스검색: 15, 블로거: 18}
weights: {출처: 50, 뉴스: 30, 검색: 20}   # 100점 나눔. 패션은 검색보다 홈피드(여러 곳에서 동시에 화제)가 중요 (2026-10-06)
news_full: 20       # 점수 만점 기준: 24시간 기사 20건이면 뉴스 만점 (경제는 100건)
vol_full: 100000    # 월 검색 10만이면 검색 만점 (경제는 100만) — 패션 검색량에 맞춤 (2026-10-06)
grok_count: 15   # Grok에게 받을 화제 수 (경제 8, 패션은 줄이 적어 15, 2026-10-06)
# 패션은 연예 RSS에 패션 기사가 적어서, 네이버 뉴스 검색(공식 API)으로 최근 24시간 패션 기사 제목을 모은다 (2026-10-06 대표 지적 "패션 키워드 수집이 약함")
news_queries: [공항패션, 사복 패션, 착용 가방, 명품 가방 착용, 드라마 의상, 데일리룩 연예인, 시상식 드레스, 화보 착장, 패션위크 착장, 브랜드 앰버서더]
news_per_query: 8
# 제목 고수(셀럽 패션) 블로거의 최근 36시간 새 글 제목도 출처로 (공개 RSS)
ref_bloggers: {influha: 유미, jayuyu: jayuyu}
