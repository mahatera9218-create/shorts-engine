# 벤치마크 대상 찾기 (설계서 15.1, 15.9). "돈·숫자형" 글을 이미 쓰는 블로그를 찾는다.
# 검색어마다 최신 글 100개를 받아, 여러 검색어에 반복해서 나오는 블로그를 후보로 올린다.
# 운영자가 바꿀 수 있다: 검색어를 더하거나 빼면 된다.

min_queries: 2        # 이 수 이상의 검색어에 나온 블로그만 후보로
top_n: 15             # 주제별 후보 수

themes:
  - id: sports
    name: 스포츠 × 돈·숫자
    queries: [연봉 순위, 몸값 순위, 이적료 순위, 1골당 연봉, 연봉 대비 성적, FA 계약 총액, 골프 상금 순위, 해외파 연봉]
  - id: ent
    name: 연예·콘텐츠 × 돈·숫자
    queries: [박스오피스 매출, 손익분기점 돌파, 누적 관객수 순위, 넷플릭스 순위, 시청률 순위, 제작비 대비 흥행, 음원 차트 순위]
  - id: economy
    name: 생활 경제 숫자
    queries: [휘발유 가격 추이, 아파트 실거래가 하락, 청약 경쟁률, 물가 상승률, 전기요금 인상, 연봉 대비 집값]
