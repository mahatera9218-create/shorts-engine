# 선수 ↔ 장소 연결 (대표 결정 2026-09-30: 연고지·여행 테마, 풀 극대화).
# 지금 소속팀 연고지는 players.yaml의 cities에서 자동으로 붙는다. 여기에는 출신지·자란 곳·예전 소속팀 연고지를 적는다.
# 공개된 경력·출생지만 (보도·공식 프로필로 확인한 것). 가족·사생활·집 주소 금지. 확인 못 한 선수는 비워 둔다.
# relation은 글에 그대로 쓰인다 ("광주는 김도영의 출신지").
players:
  류현진:
    - {city: 인천, relation: 출신지}
    - {city: 로스앤젤레스, relation: "예전 소속팀(LA 다저스, 2013~2019년) 연고지"}
    - {city: 토론토, relation: "예전 소속팀(토론토 블루제이스, 2020~2023년) 연고지"}
  김광현:
    - {city: 안산, relation: "자란 곳(안산공고 졸업)"}
    - {city: 세인트루이스, relation: "예전 소속팀(세인트루이스 카디널스, 2020~2021년) 연고지"}
  양현종:
    - {city: 광주, relation: 출신지}
    - {city: 알링턴, relation: "예전 소속팀(텍사스 레인저스, 2021년) 연고지"}
  김도영:
    - {city: 광주, relation: 출신지}
  문동주:
    - {city: 광주, relation: "출신 고교(광주진흥고) 지역"}
  노시환:
    - {city: 울산, relation: 출생지}
    - {city: 부산, relation: "출신 고교(경남고) 지역"}
  구자욱:
    - {city: 대구, relation: 출신지}
  원태인:
    - {city: 대구, relation: 출신지}
  양의지:
    - {city: 광주, relation: 출신지}
    - {city: 창원, relation: "예전 소속팀(NC 다이노스, 2019~2022년) 연고지"}
  이정후:
    - {city: 나고야, relation: 출생지}
    - {city: 서울, relation: "예전 소속팀(키움 히어로즈) 연고지"}
  김혜성:
    - {city: 고양, relation: 출신지}
    - {city: 서울, relation: "예전 소속팀(키움 히어로즈) 연고지"}
  김하성:
    - {city: 부천, relation: 출신지}
    - {city: 서울, relation: "예전 소속팀(키움 히어로즈) 연고지"}
    - {city: 샌디에이고, relation: "예전 소속팀(샌디에이고 파드리스) 연고지"}
  오타니 쇼헤이:
    - {city: 오슈, relation: "출신지(이와테현)"}
    - {city: 삿포로, relation: "예전 소속팀(닛폰햄 파이터스, 2013~2017년) 연고지"}
    - {city: 애너하임, relation: "예전 소속팀(LA 에인절스, 2018~2023년) 연고지"}
  애런 저지:
    - {city: 린든, relation: "자란 곳(캘리포니아)"}
  손흥민:
    - {city: 춘천, relation: 출생지}
    - {city: 함부르크, relation: "예전 소속팀(함부르크 SV) 연고지"}
    - {city: 레버쿠젠, relation: "예전 소속팀(바이어 레버쿠젠) 연고지"}
    - {city: 런던, relation: "예전 소속팀(토트넘 홋스퍼, 2015~2025년) 연고지"}
  이강인:
    - {city: 인천, relation: 출생지}
    - {city: 발렌시아, relation: "예전 소속팀(발렌시아 CF) 연고지"}
    - {city: 마요르카, relation: "예전 소속팀(RCD 마요르카) 연고지"}
    - {city: 파리, relation: "예전 소속팀(파리 생제르맹, 2023~2026년) 연고지"}
  김민재:
    - {city: 통영, relation: 출생지}
    - {city: 전주, relation: "예전 소속팀(전북 현대) 연고지"}
    - {city: 베이징, relation: "예전 소속팀(베이징 궈안) 연고지"}
    - {city: 이스탄불, relation: "예전 소속팀(페네르바체) 연고지"}
    - {city: 나폴리, relation: "예전 소속팀(SSC 나폴리, 2022~2023년) 연고지"}
  황희찬:
    - {city: 춘천, relation: 출생지}
    - {city: 부천, relation: 자란 곳}
    - {city: 잘츠부르크, relation: "예전 소속팀(레드불 잘츠부르크) 연고지"}
    - {city: 라이프치히, relation: "예전 소속팀(RB 라이프치히) 연고지"}
    - {city: 울버햄튼, relation: "원 소속팀(울버햄튼 원더러스) 연고지"}
  엘링 홀란:
    - {city: 브뤼네, relation: "자란 곳(노르웨이)"}
    - {city: 잘츠부르크, relation: "예전 소속팀(레드불 잘츠부르크) 연고지"}
# 확인 못 함 (비워 둠): 최정·박세웅·고영표·야마모토·음바페·메시·골프 선수의 출신지 → 확인되면 추가

# 도시 정보: country KR = 국내 (아파트값 테마 가능), 그 밖 = 해외 (여행 테마만)
cities:
  국내: [서울, 인천, 광주, 대전, 대구, 부산, 울산, 수원, 안산, 창원, 고양, 부천, 춘천, 통영, 전주]
# 여행 경비 (국민여행조사 2025, 문화체육관광부·한국문화관광연구원, 2026-06-30 발표). 도시별 비용이 아니라 전국 평균이다.
travel:
  domestic: {price_krw: 131272, label: "국내여행 1회 평균 경비 (총지출 39조5천억원 ÷ 3억90만회)", as_of: 2026-06-30,
             source: "국민여행조사 2025 보도 https://www.sisajournal.com/news/articleView.html?idxno=378149"}
  overseas: {price_krw: 1423000, label: "해외여행 1회 평균 경비 (평균 4.7일 체류)", as_of: 2026-06-30,
             source: "국민여행조사 2025 보도 https://www.starnewskorea.com/business-life/2026/06/30/2026063010193068378"}
