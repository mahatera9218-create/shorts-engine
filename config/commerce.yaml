# 쇼핑커넥트 상품군 (대표 결정 2026-09-30): 팔 만한 상품군을 먼저 정하고, 우리 풀(테마 × 선수)에서 그 상품군과 맞는 글을 뽑는다.
# 상품 고르기 (대표 결정 2026-09-30): 목록이 너무 많아 캡처 대신, 도우미가 글마다 '검색어'를 준다 →
#   대표가 발행할 때 브랜드 커넥트에서 그 검색어로 찾아 기준(아래 pick)에 맞는 상품 1개를 글에 붙인다.
#   keywords는 상품군마다 돌려 쓴다 (글마다 다르게). {team}은 그 선수 팀 이름으로 바뀐다.
# 규칙: 글·클립은 정보가 먼저 (상품을 억지로 넣지 않음), 글 하나에 상품군 하나, 광고 고지 필수,
#       상품 태그를 다는 클립에는 선수 사진을 쓰지 않는다 (보증 오해 방지: 물건이 주인공인 버전을 따로 만든다).
#       영양제·보충제(건강 효능 주장 위험), 사인 굿즈(진품 확인 불가)는 다루지 않는다.
active: true
pick: "리뷰 많은 상품 · 수수료 높은 쪽 · 1~5만원대 (부담 없이 사는 값)"
disclosure: "이 글(영상)에는 네이버 쇼핑커넥트 링크가 있어, 링크로 구매하시면 판매 수수료를 받을 수 있어요."
categories:
  car:     {name: 차량용품, when: "생활 물가 테마에서 비교 물건이 차 (car_kr·car_import)", products: [],
            keywords: [차량용 휴대폰 거치대, 차량용 무선충전기, 차량용 방향제, 트렁크 정리함, 세차용품 세트]}
  home:    {name: 인테리어·생활용품, when: "생활 물가(집값)·연고지 아파트 테마", products: [],
            keywords: [수납 정리함, 무드등, 암막커튼, 거실 러그, 디퓨저]}
  travel:  {name: 여행용품, when: "몸값 여행 테마", products: [],
            keywords: [여행용 파우치 세트, 기내용 캐리어, 목베개, 멀티 어댑터, 여행용 압축팩]}
  fan:     {name: 유니폼·응원·관람용품, when: "유니폼 테마, 그리고 가을야구·큰 경기 시즌의 선수 글", products: [],
            keywords: ["{team} 유니폼", 응원 타월, 야구장 방석, 휴대용 우비, 공연 쌍안경]}
  sport:
    name: 종목 운동용품
    when: "영수증·같은/다른 종목 비교·순위 글 (종목에 맞게)"
    products: []
    keywords:
      야구: [야구 글러브, 배팅 장갑, 야구공]
      골프: [골프공, 골프 장갑, 골프 거리측정기]
      농구: [농구공, 농구화]
      축구: [축구공, 풋살화]
# 세금 테마는 상품군 없음 (돈·세금 글에 물건을 붙이지 않는다)
