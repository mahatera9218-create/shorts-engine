# 반응 좋은 글의 규칙 (어사이드 블로거 조사에서 '반응 좋은 글에만 있는 것'으로 분류된 것, 대표 지시 2026-10-08).
# 도우미 제목 칸에 '👍 잘 된 글 규칙'으로 보이고, 제목 만들 때 참고로 들어감 (content/good_rules.py).
# 제목 규칙만 (대표 원칙 2026-10-08: 글 작성은 다른 블로거를 따라 하지 않고 쿠니네식으로만 — 조사에서 가져오는 건 제목·키워드·반응뿐).
# 경제는 어사이드 경제 블로거 조사(docs/prompts/aside-경제-글방식-조사.md) 결과를 받으면 채움.
fashion:
  source: blogs/fashion/ref/2026-10-08-패션-글방식-조사.md
  title:
    - 두 사람 비교·대결 구도 (같은 옷·가방, 나이대 대비) — 공감 약 2배
    - 이름 숨기고 나이·키·상황으로 궁금증 ('여배우', '그 배우') — 약 1.7배
    - 본인 말이나 대중 반응을 따옴표로 제목 맨 앞에
    - 논란·반응 단어 (난리·논란·레전드·역변) — 약 1.5배
    - 물음표·말줄임 — 약 1.3배
    - 25자 이상 (25자 미만은 오히려 낮음), 브랜드명은 효과 거의 없음
    - 쿠니네도 반응 좋은 글은 논란·사연 각도뿐 (아이템·가격 소개 각도는 낮음)
econ:
  source: econ/ref/2026-10-08-경제-글방식-조사.md
  title:
    - "'내 돈 기준' 주제어 (순자산·연봉·중산층·생활비·소득) — 공감 1.34배, 상위 글 43% vs 15%"
    - 논란·충격 단어 1개 (논란·폭락·경고·위기) — 1.24배
    - 25자 미만으로 짧게 — 1.20배 (40자 이상은 낮음)
    - 금액 숫자 (○억·○만원) — 1.14배
    - 세대·나이 (30대·3040) — 상위 글 14% vs 7%
    - "쿠니네: 키워드 맨 앞 + 쉼표 뒤 반전 훅 (따로 있다·함정일까?·싸다고?·대체 왜?)"
    - "피하기: 종목명 앞세운 주가 소식형(1.01배), 제도 '총정리·조건·신청' 사전형(0.91배)"
    - "우리는 못 씀: 1인칭 경험형(~했더니, 1.26배) — 가짜 경험 금지"
