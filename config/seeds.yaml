# 씨앗 키워드 (KICKOFF.md). 모두 가설이며 점수로 결정한다.
# 운영자가 바꿀 수 있다: 휴대폰 GitHub 앱/브라우저에서 이 파일을 열고 연필(편집) 버튼.
#
# affiliate: 제휴 가치 사전값 (1~5). API로 잴 수 없어 가정으로 둔다.
#   1 = 연결할 상품·제휴 거의 없음, 5 = 단가 높은 상품 제휴가 자연스러움.
#   운영 데이터(제휴 클릭·매출)가 쌓이면 보정한다.
# shopping_category: 네이버 쇼핑 인사이트 카테고리 코드 (선택). 모르면 비워 둔다.
# include_terms: (선택) 씨앗과 글자가 안 겹쳐도 남길 연관 키워드의 핵심 단어.
#   씨앗·영역 이름·include_terms 어느 것과도 두 글자가 겹치지 않는 연관 키워드는 자동으로 뺀다 (global.yaml relevance_filter).

areas:
  # 2026-09-29 비교 조사: 홈판 주력 결정 후 스포츠(선수 중심)와 여행·축제를 같은 기준으로 잰다.
  # 자영업·가전·업무용 IT는 1차 조사로 끝났으므로 뺐다 (결과는 reports/market/2026-09-29*에 보존).
  - id: sports-kbo
    name: 스포츠·국내 선수
    affiliate: 1
    seeds: [프로야구 연봉 순위, 프로야구 FA, 프로야구 선수 기록]
    include_terms: [야구, 연봉, 이적, 기록, 선수, 프로필, 트레이드, 부상]
  - id: sports-abroad
    name: 스포츠·해외파 선수
    affiliate: 1
    seeds: [손흥민 연봉, 이정후 기록, 김민재 이적]
    include_terms: [손흥민, 이정후, 김민재, 이강인, 김하성, 황희찬, 연봉, 이적, 기록]
  - id: festival
    name: 여행·축제·나들이
    affiliate: 2
    seeds: [가을 축제, 단풍 명소, 주말 가볼만한곳]
    include_terms: [축제, 단풍, 나들이, 여행, 가볼만한, 행사, 불꽃]
  - id: life-economy
    name: 생활 경제 숫자
    affiliate: 2
    seeds: [휘발유 가격, 아파트 실거래가, 청약 일정]
    include_terms: [유가, 기름값, 주유소, 실거래가, 청약, 물가, 전기요금]
  - id: car
    name: 자동차
    affiliate: 3
    # 2026-09-29: 블로그가 금방 보이는 비교·질문형으로 교체 (차종·모델명 정리형은 블로그가 한참 아래, 대표 확인)
    seeds: [인증중고차 비교, 중고차 사이트 비교, 경차 유지비, 자동차 유지비]
    include_terms: [인증중고, 중고차, 유지비, 수수료, 보증]
