# 그림 창고 (대표 결정 2026-10-05): 고화질 본문 그림을 한 번 그려 두고 글마다 골라 다시 쓴다.
# content/art_library.py가 없는 것만 그린다 → assets/art-library/<id>.jpg (JPG 95, 원본 해상도 1536x1024)
# hero: true = 억선생(쇼츠 1번 장면 참고 그림으로 얼굴·옷을 맞춤). tags = 글에서 고를 때 쓰는 말.
# 모든 그림: 글자 없음, 한국 전통 요소, 화투 팔레트 (content/post_art.STYLE)
scenes:
  - {id: dawn-rooster, hero: true, tags: [아침, 시황, 시작], prompt: "At dawn a rooster crows on a thatched roof while Mr. Eok stretches and opens the wooden shutters of his market stall, misty mountains and a rising red sun."}
  - {id: market-morning, hero: true, tags: [아침, 시황, 장터], prompt: "Morning Joseon market street filling with people in hanbok; Mr. Eok cheerfully greets the crowd from his stall full of yeopjeon strings and small gold bars."}
  - {id: market-board, hero: true, tags: [시황, 정리, 설명], prompt: "Mr. Eok points with a long brush at a large blank wooden notice board (no writing on it) beside his stall while curious villagers gather around."}
  - {id: rise-dance, hero: false, tags: [급등, 상승, 축제], prompt: "A joyful crowd dancing in the market square with drums and a farmers' music band (pungmul), a boy acrobat lifted on shoulders (mudong), colorful ribbons flying."}
  - {id: rise-kite, hero: true, tags: [상승, 오름세], prompt: "Mr. Eok flies a traditional Korean shield kite (bangpae-yeon) that soars high into a bright sky over thatched village roofs, children cheering."}
  - {id: rise-climb, hero: true, tags: [상승, 신고가, 고점], prompt: "Mr. Eok climbs a steep stylized minhwa mountain path with a jige on his back and is close to the summit, looking up hopefully, pine trees and clouds."}
  - {id: fall-tiger, hero: true, tags: [급락, 하락, 충격], prompt: "A flat humorous minhwa tiger leaps down into the market; gold bars and coin strings scatter in the air and Mr. Eok and the villagers jump back in surprise."}
  - {id: fall-spill, hero: true, tags: [하락, 손실, 쏟아짐], prompt: "Mr. Eok trips and his jige tips over, strings of yeopjeon coins and small gold bars spill and roll down a sloping dirt road; he reaches out in dismay."}
  - {id: fall-rain, hero: true, tags: [약세, 관망, 비], prompt: "Rainy day at a quiet market; Mr. Eok stands under a red oil-paper umbrella in front of his covered stall, looking at the sky calmly."}
  - {id: crisis-storm, hero: false, tags: [위기, 불안, 전쟁, 공포], prompt: "Dark swirling minhwa storm clouds with a lightning bolt over the Joseon market; villagers in hanbok hurry home holding their hats, stall cloths flapping in the wind."}
  - {id: crisis-gold-rush, hero: true, tags: [안전자산, 금, 불안, 수요], prompt: "A worried crowd rushes to Mr. Eok's stall reaching for small gold bars; he holds an armful of gold bars, overwhelmed but smiling."}
  - {id: rate-chests, hero: true, tags: [금리, 인상, 돈이동], prompt: "Villagers carry wooden coin chests away from Mr. Eok's stall toward a large tiled-roof merchant house across the street; he watches with a puzzled face."}
  - {id: rate-ledger, hero: true, tags: [금리, 예금, 이자, 은행], prompt: "Inside a tiled-roof merchant house (gaekju), Mr. Eok sits at a low desk writing in a thick ledger with a brush beside stacked coin strings and an abacus, lamplight."}
  - {id: dollar-ship, hero: false, tags: [달러, 환율, 외국, 미국], prompt: "A large foreign sailing ship arrives at a busy Joseon harbor; porters unload chests of silver coins onto the pier, fishing boats and seagulls."}
  - {id: dollar-scale, hero: true, tags: [달러, 강세, 금, 비교], prompt: "Mr. Eok weighs a small gold bar on a traditional balance scale against a heavy pile of foreign silver coins; the scale tips down on the silver side and he looks surprised."}
  - {id: us-port-trade, hero: true, tags: [미국주식, 해외, 거래], prompt: "At the harbor Mr. Eok trades with a tall foreign merchant in a long coat (no face details emphasized, generic), exchanging coin strings for crates of goods; ships behind."}
  - {id: kr-guild, hero: true, tags: [국내주식, 기업, 회의], prompt: "A merchants' guild meeting in a wooden hall: merchants in gat sit in a circle on floor mats discussing around low tables with ledgers; Mr. Eok raises his hand to speak."}
  - {id: rumor-jumak, hero: true, tags: [이슈, 실적, 소문, 뉴스], prompt: "A lively tavern (jumak) with a straw-roofed porch; villagers lean in to whisper news over bowls of makgeolli while Mr. Eok listens with a raised eyebrow."}
  - {id: notice-crowd, hero: false, tags: [발표, 뉴스, 정책], prompt: "A crowd gathers in front of a village government notice wall with several blank paper notices (no writing) pinned up; a runner in a red uniform pins a new one."}
  - {id: versus-ssireum, hero: false, tags: [대결, 비교, 경쟁], prompt: "Kim Hong-do style ssireum wrestling match: two wrestlers with satba belts grapple in a sand ring, one red sash and one blue sash, a cheering circle of spectators."}
  - {id: wait-pavilion, hero: true, tags: [관망, 기다림, 휴식], prompt: "Mr. Eok sits in a wooden pavilion (jeongja) by a lotus pond drinking tea and watching the clouds, calm and patient, willow branches swaying."}
  - {id: seodang-lesson, hero: true, tags: [기본기, 공부, 설명], prompt: "A village seodang classroom: Mr. Eok as the teacher with a long pipe explains with a pointer to students in hanbok sitting at low desks with brushes and paper."}
  - {id: abacus, hero: true, tags: [계산, 정리, 기본기], prompt: "Close view of Mr. Eok happily flicking the beads of a Korean wooden abacus on a low table with a brush, inkstone and coin strings."}
  - {id: savings-jars, hero: true, tags: [저축, 적금, 모으기], prompt: "In a sunny courtyard with rows of onggi jars (jangdokdae), Mr. Eok drops yeopjeon coins into a large earthenware jar, smiling, a magpie on the stone wall."}
  - {id: safe-chest, hero: true, tags: [예금, 안전, 보관], prompt: "Mr. Eok closes a sturdy wooden chest with a big brass butterfly lock and pats it reassuringly, inside a tidy storeroom."}
  - {id: coin-glow, hero: true, tags: [코인, 비트코인, 가상자산, 신기술], prompt: "A mysterious glowing golden yeopjeon coin floats in the air above Mr. Eok's palm at night, emitting soft light rays; villagers peek from behind a stone wall in wonder."}
  - {id: swing-dano, hero: false, tags: [변동성, 코인, 오르내림], prompt: "A Dano festival scene: a woman in hanbok swings very high on a tall rope swing (geune) under a big tree, ribbons flying, a crowd watching below."}
  - {id: harvest, hero: true, tags: [배당, 수확, 결실], prompt: "Autumn harvest: golden rice fields, villagers bundling rice sheaves; Mr. Eok carries a full bundle of rice on his jige, smiling, red persimmon tree."}
  - {id: sowing, hero: true, tags: [장기, 적립, 시작, 씨앗], prompt: "Spring: Mr. Eok sows seeds in a neat field with a straw basket, plum blossoms in bloom, a small thatched house behind."}
  - {id: night-moon, hero: false, tags: [밤사이, 미국장, 해외장], prompt: "Night over the Joseon market under a huge full moon; lanterns glow, a few night travelers, a distant harbor with ships under the moonlight."}
