# 키워드 점수 (대표 지시 2026-10-05: Grok만 믿지 말고 여러 소스, 겹치면 우선순위). content/econ_score.py
# 점수 100점 = 출처 겹침 40(그날 1등 기준) + 네이버 뉴스량 25 + 검색량 35 (2026-10-05 조정: 빈자리 항목 뺌)

# 출처별 점수 (한 키워드에 여러 출처가 겹칠수록 높아짐, 최대 40)
source_points:
  대표: 15            # 대표가 넣은 키워드 (어드바이저·뉴스 랭킹·트렌드 등)
  캡처: 15            # 어드바이저 캡처에서 읽은 키워드
  블로거: 4           # 그 밖의 참고 블로거 한 명마다
  Grok: 6             # X·웹 화제
  국내뉴스: 2         # 국내 경제 RSS 기사 한 건마다 (최대 10)
  해외뉴스: 2         # 야후 파이낸스·CNBC 등 한 건마다 (최대 8)
  시세: 8             # 코드가 잡은 시세 급변
  인기종목: 8         # 아래 watch 종목 중 최근 24시간 기사가 많은 것
caps: {국내뉴스: 10, 해외뉴스: 8}

# 100점 나눔 (2026-10-06 대표 지시: 따끈할수록 가점) — 최신 = 최근 6시간 네이버 기사 수 (10건이면 만점)
weights: {네이버: 35, 최신: 15, 출처: 15, 뉴스: 15, 검색: 20}   # 2026-10-10 대표 지적 "네이버에서 뜨는 주제가 약하다": 네이버 검색량 10→20·뉴스 10→15 올리고, X·속보성(출처·최신) 내림
# ↑ 2026-10-07 대표 결정: 어사이드(네이버 홈판·인기글) 배점이 가장 크고, 최신성 > 뉴스량·검색량.
#   "네이버에서 가장 최근·가장 핫한 키워드인데 X·블로거·뉴스에서도 나오는 것"이 위로. 어사이드 없는 날은 나머지 65점을 100점으로 환산.
skip_bloggers: [zkfldb888]   # 쿠니네는 키워드 조사에서 뺌 (대표 지시 2026-10-07). 썸네일 방식 참고는 그대로
blogger_keywords: false   # 경제는 블로거 글에서 키워드를 가져오지 않음 (대표 결정 2026-10-07: 경제 블로거는 '핫키워드'를 여러 개 올리다가
                          # 조회수 터진 것만 몰아서 다시 올려, 블로거 겹침이 실제 화제가 아니라 그들의 반복을 셈). 제목 고수 참고는 그대로
fresh_full: 10

# 도우미 경제 키워드 섹션 (대표 결정 2026-10-09: 삼성전자·하이닉스만 나오지 않게 섹션별 3개씩, 55점 미만은 안 보임)
sections: [국내주식, 해외주식, 금·비트코인]
section_n: 3
stale_penalty: 12   # 최근 며칠 상위에 나온 주제는 하루당 -12점 (대표 지시 2026-10-10 "맨날 똑같다": 매일 반복되는 대형주·코인 가라앉히고 새 주제 올리기)
stale_cap: 30       # 반복 감점 최대
stale_days: 3       # 최근 3일 비교
stale_topn: 12      # 그날 상위 12개까지 '나온 것'으로 셈
min_show: 55
# 네이버 급상승 탐지 씨앗 (대표 요청 2026-10-10, content/rising.py): 검색광고 연관 키워드 → 최근 3일 검색 상승 → 24시간 새 블로그 글
rising_seeds: [삼성전자, SK하이닉스, 코스피, 현대차, 2차전지, 엔비디아, 테슬라, 애플, 나스닥, 미국주식, 비트코인, 금값, 이더리움, 리플, 금리, 환율, 연금, 청약, ETF, 배당주]
rising_min_volume: 3000
