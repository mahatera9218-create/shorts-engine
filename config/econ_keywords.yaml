# 유튜브 화제성 보조 (대표 결정 2026-10-10): 상위 후보에만 최근 7일 영상 수를 물어 +보너스 (search.list 100단위라 쿼터 아낌)
youtube_bonus: 8   # 최대 보너스 점
youtube_top: 10    # 상위 몇 개에만 물을지
youtube_full: 500  # 최근 7일 영상 이 수면 보너스 만점
surge_rise: 2.0   # 🔥급부상 표시 기준: 최근 3일 검색이 평소의 몇 배 이상이면 (대표 요청 2026-10-10)
rewrite_days: 14      # 최근 이 기간에 이미 쓴 주제는 키워드에서 뺌 (대표 2026-10-10)
rewrite_bigvol: 200000  # 월 검색이 이 이상인 초대형 키워드는
rewrite_bigdays: 3      # 이 기간(일)만 지나면 또 써도 됨 (대표 결정 2026-10-11 "3일 간격, 일단 다양하게")

checklist_pass_ratio: 0.8   # 원문 체크 통과율 목표 (대표 "8/10" = 80%, 2026-10-10)

strict_editor: true   # 엄격한 편집장(AI) 검수 켜기 (대표 결정 2026-10-10, 글당 약 15~30원)
max_rewrite: 2        # 1회=기본 고치기, 2회=편집장이 대표 대신 판단해 마무리(고칠 게 있을 때만). 최대 2회 (대표 지시 2026-10-11)
