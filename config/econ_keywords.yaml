# 키워드 점수 (대표 지시 2026-10-05: Grok만 믿지 말고 여러 소스, 겹치면 우선순위). content/econ_score.py
# 점수 100점 = 출처 겹침 40(그날 1등 기준) + 네이버 뉴스량 25 + 검색량 35 (2026-10-05 조정: 빈자리 항목 뺌)

# 출처별 점수 (한 키워드에 여러 출처가 겹칠수록 높아짐, 최대 40)
source_points:
  대표: 15            # 대표가 넣은 키워드 (어드바이저·뉴스 랭킹·트렌드 등)
  캡처: 15            # 어드바이저 캡처에서 읽은 키워드
  블로거: 4           # 그 밖의 참고 블로거 한 명마다
  Grok: 6             # X·웹 화제
  국내뉴스: 2         # 국내 경제 RSS 기사 한 건마다 (최대 10)
  해외뉴스: 2         # 야후 파이낸스·CNBC 등 한 건마다 (최대 8)
  시세: 8             # 코드가 잡은 시세 급변
  인기종목: 8         # 아래 watch 종목 중 최근 24시간 기사가 많은 것
  급상승: 8           # 네이버 검색어트렌드 급상승으로 찾은 키워드 (2026-10-10)
caps: {국내뉴스: 10, 해외뉴스: 8}

# 100점 나눔 — 큰 구조 화제성:최신성:수요 = 2:1:1 (대표 결정 2026-10-10)
weights: {급상승: 23, 뉴스: 16, 출처: 11, 블로거: 25, 네이버: 15, 검색: 25}
# 화제성 50 = 급상승23 + 뉴스16 + 출처11(블로거 제외). 최신성 25 = 블로거(우선, 최대 25) + 어사이드(네이버, 보조 최대 15) 합쳐 상한 25. 수요 25 = 검색.
blogger_full: 3    # 서로 다른 블로거 3명이면 최신성 블로거 만점 (경제는 겹침이 많아 문턱 높임, 1명8·2명17·3명+25, 대표 지시 2026-10-10). 같은 블로거 반복은 무시
fresh_cap: 25      # 최신성 상한
# ↑ 2026-10-10 홈판 재정의(reports/2026-10-10-홈판-노출-전략-정의.md): 목표는 검색 상위가 아니라 홈판 피드 노출.
#   피드는 "지금 뜨는가"에 민감 → 화제성(검색어트렌드 급상승·뉴스량·출처겹침) 50 : 최신성(블로거·어사이드) 25 : 수요(월 검색량) 25 = 2:1:1 (대표 결정 2026-10-10).
#   최신성: 뉴스 기반 '최신' 점수는 오래된 키워드를 최신처럼 집어 끔. 대신 ① 선택 블로거가 어제오늘 쓴 주제(서로 다른 블로거 수, 반복 무시) ② 어사이드 홈판 순위. 블로거 우선, 어사이드 없어도 블로거 단독으로 감.
#   급상승 = 검색어트렌드 최근 3일 상승률(평소의 2배↑ 만점). 환산 없음(최신성이 블로거로 매일 들어와 0이 되지 않음).
skip_bloggers: [zkfldb888]   # 쿠니네는 키워드 조사에서 뺌 (대표 지시 2026-10-07). 썸네일 방식 참고는 그대로
blogger_keywords: true    # 경제 블로거 켬 (대표 결정 2026-10-10): 어제오늘 쓴 주제를 최신성 신호로. 2026-10-07 '반복이라 못 믿는다'는
                          # 서로 다른 블로거 수로만 세어(같은 블로거가 같은 키워드를 반복해 올려도 1명으로) 해결 — content/econ_score.py it["bloggers"]
fresh_full: 10

# 도우미 경제 키워드 섹션 (대표 결정 2026-10-09: 삼성전자·하이닉스만 나오지 않게 섹션별 3개씩, 55점 미만은 안 보임)
sections: [국내주식, 해외주식, 금·비트코인, 부동산, 환율, 생활경제]   # 부동산·환율·생활경제 추가 (대표 요청 2026-10-10, 정부 지원금·정책은 뺌)
