rising_entities: [삼성전자, SK하이닉스, LG에너지솔루션, 삼성바이오로직스, 현대차, 기아, 셀트리온, KB금융, 신한지주, 하나금융지주, 우리금융지주, 네이버, 카카오, 카카오뱅크, POSCO홀딩스, 포스코퓨처엠, LG화학, 삼성SDI, 한화에어로스페이스, 두산에너빌리티, HD현대중공업, 한화오션, 삼성중공업, 삼성물산, 현대모비스, 메리츠금융지주, 삼성생명, 크래프톤, 알테오젠, 에코프로, 에코프로비엠, HLB, 레인보우로보틱스, 삼양식품, 한미반도체, LS일렉트릭, 효성중공업, 한국전력, 대한항공, SK텔레콤, KT, 하이브, 엔씨소프트, 고려아연, 한미약품, 유한양행, 아모레퍼시픽, 엔비디아, 테슬라, 애플, 마이크로소프트, 아마존, 알파벳, 구글, 메타, 브로드컴, TSMC, 팔란티어, AMD, 인텔, 마이크론, 넷플릭스, 아이온큐, 코인베이스, 일라이릴리, 노보노디스크, 오픈AI, 비트코인, 이더리움, 리플, 솔라나, 도지코인]   # 75 → 55 (대표 결정 2026-10-09: 75면 섹션이 거의 비어서)
