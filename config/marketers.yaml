# 마케터 3명 (대표 결정 2026-10-01): 같은 AI가 전략(테마·선수)만 달리해 동시에 쓴다 → 누구 전략이 잘 되는지 비교.
# - 블로그: 하루 1편, 차례대로 (rotation_start 날 = 마케터 1, 다음 날 2, 3, 1 …). 도우미가 오늘 차례 글을 맨 위에.
#   차례 글이 ⚠️(기준 미달)이거나 없으면 다음 마케터 글이 올라온다. 대표가 다른 글을 골라도 된다.
# - 클립: 3명 것 다 올린다 (조회가 많아 비교가 빠르다).
# - 선수가 겹치지 않게: 화제형은 최근 뉴스가 많은 선수, 체감형·비교형은 나머지를 이름으로 반씩 나눈다.
# - 4주마다 주간 점검에서 꼴찌 전략을 새 전략으로 바꾼다 (토너먼트).
# - 종목 (대표 결정 2026-10-02): 하루 3편 중 야구(KBO·MLB)는 1편. 날마다 한 마케터만 야구를 쓰고 나머지 둘은 축구·농구·골프.
#   야구 차례는 1→3→2… 로 돌아서 블로그 ⭐ 글은 사흘에 한 번 야구 (sport_plan).
baseball_max: 1
rotation_start: 2026-10-01
marketers:
  1:
    name: 체감형
    desc: 연봉을 생활 물가(차·집·여행·유니폼)로 바꿔 체감하게
    players: rest
    themes: {life: 5, place: 1, trip: 1, jersey: 1}
  2:
    name: 비교형
    desc: 선수끼리 붙이기, 순위·총정리 (수·토 순위 글은 이 마케터)
    players: rest
    rank: true
    themes: {same: 2, cross: 2, receipt: 1}
  3:
    name: 화제형
    desc: 지금 뉴스가 많은 선수의 연봉 영수증·세금
    players: hot
    themes: {receipt: 2, tax: 1, life: 1}
