# 틈새 키워드 조사 씨앗 (market.niche 전용).
# 조사 테마 = 부동산(재건축/재개발/선도지구 중심)·바이오 2개 (대표 2026-11-02, 효율 분석 반영).
#  - 부동산: 재건축/정비 효율 최고(효율 497, 아웃라이어 빼도 204). 재건축·재개발·선도지구 중심 + 청약 보조.
#  - 바이오: 저경쟁 검색 채널(증시 대체). 금·연금·일반 시세글은 효율 낮아 제외.
# 씨앗을 넣으면 그 씨앗 + 연관 키워드의 월 검색량(PC·모바일)·블로그 문서수·경쟁강도를 잰다.

부동산:
  - 재건축
  - 재개발
  - 분당 선도지구
  - 1기 신도시 재건축
  - 1기 신도시 선도지구
  - 목동 재건축
  - 여의도 재건축
  - 압구정 재건축
  - 신반포 재건축
  - 노후계획도시
  - 재건축 초과이익환수
  - 재건축 안전진단
  - 동탄 청약
  - 반포 분양

바이오:
  - 펩트론
  - 셀트리온
  - HLB
  - 삼천당제약
  - 삼성바이오로직스
  - 알테오젠
  - 유한양행
  - 한미약품
  - 리가켐바이오
  - 에이비엘바이오
  - SK바이오팜
  - 오스코텍

settings:
  per_group_cap: 40    # 그룹마다 문서수까지 조사할 키워드 최대 개수(연관 포함, API 호출 수 제한)
  min_volume: 500      # 월 검색량(PC+모바일) 이 미만이면 제외
