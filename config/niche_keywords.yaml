# 틈새 키워드 조사 씨앗 (market.niche 전용). 대표 2026-10-23.
# 금·환율·정년연장은 키워드가 사실상 고정이라 조사 안 함 — 바뀌는 테마(증시·부동산·세무절세·연금·생활경제)만 조사한다.
# (2026-11-01 대표 "기존 테마 전부로 확장, 비중·니치만 조절". 새 테마는 안 만든다.)
# 증시: 지금 화제인 종목·테마를 자주 갱신. 부동산: 검색량 높고 경쟁강도 낮은 것 찾기.
# 씨앗을 넣으면 그 씨앗 + 연관 키워드의 월 검색량(PC·모바일)·블로그 문서수·경쟁강도를 잰다.

증시:
  - SK하이닉스
  - 삼성전자
  - 두산에너빌리티
  - 한화에어로스페이스
  - 에코프로비엠
  - 코스피 전망
  - 반도체 관련주

부동산:
  - 분당 재건축
  - 동탄 청약
  - 계양 신도시 청약
  - 주택담보대출 금리
  - 전세 사기
  - 재건축 초과이익환수
  - 1주택 양도세

세무절세:
  - 양도소득세
  - 종합부동산세
  - 취득세
  - 상속세
  - 증여세
  - 연말정산

연금:
  - 국민연금
  - 연금저축
  - IRP
  - 퇴직연금
  - 주택연금

생활경제:
  - 예금금리
  - 물가
  - 전기요금
  - 최저임금
  - 실업급여
  - 기초연금

settings:
  per_group_cap: 40    # 그룹마다 문서수까지 조사할 키워드 최대 개수(연관 포함, API 호출 수 제한)
  min_volume: 500      # 월 검색량(PC+모바일) 이 미만이면 제외
