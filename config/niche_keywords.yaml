# 틈새 키워드 조사 씨앗 (market.niche 전용). 대표 2026-10-23.
# 조사 테마 = 증시(바이오)·부동산(재건축)·연금 (대표 2026-11-01, 강사 지시 반영).
#  - 증시: 강사 추천 '바이오주 집중'(아직 저경쟁). 반도체 대형주는 경쟁 폭발(글 수백만)이라 뺌.
#  - 부동산: 대표 핫키워드 '재건축'(조회수 잘 나옴) 중심.
#  - 적금은 매일 쓸 소재가 얇아 제외(대표 2026-11-01). 금·환율·정년연장도 고정이라 제외.
# 씨앗을 넣으면 그 씨앗 + 연관 키워드의 월 검색량(PC·모바일)·블로그 문서수·경쟁강도를 잰다.

증시:
  - 펩트론
  - 셀트리온
  - HLB
  - 삼천당제약
  - 삼성바이오로직스
  - 알테오젠

부동산:
  - 재건축
  - 재개발
  - 분당 재건축
  - 목동 재건축
  - 1기 신도시 재건축
  - 재건축 초과이익환수

연금:
  - 국민연금
  - 연금저축
  - IRP
  - 퇴직연금
  - 주택연금

settings:
  per_group_cap: 40    # 그룹마다 문서수까지 조사할 키워드 최대 개수(연관 포함, API 호출 수 제한)
  min_volume: 500      # 월 검색량(PC+모바일) 이 미만이면 제외
