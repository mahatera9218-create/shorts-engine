# 틈새 키워드 조사 (market.niche 전용).
# 2026-11-25 대표: ★ 강사(쿠니네) 주간 키워드를 발행 전에 먼저 경쟁강도로 조사한다.
#   이유 = 강사 키워드 중 경쟁 센 것은 발행해도 노출이 안 뜸. 미리 재서 '검색량 있고 경쟁 낮은' 것부터 고른다.
#   → 매주 강사 리스트 받으면 이 파일 씨앗을 그 주 키워드로 갈아끼우고 PR 머지(엔진 자동 실행).
# 씨앗을 넣으면 그 씨앗 + 연관 키워드의 월 검색량(PC·모바일)·블로그 문서수·경쟁강도를 잰다.
# ※ 이 설정은 main 브랜치에 머지돼야 엔진(GitHub Actions)이 쓴다. 결과 = niche-results 브랜치 reports/검색량/.

