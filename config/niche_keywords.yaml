# [조사 스파이크 2026-11-24] IT vs 골프 전용 블로그 틈새 검증용 임시 설정.
# 경제 씨앗(주식·부동산·정책·환율·금리·연금·세무)은 git 이력에 있으며 조사 후 복원한다.
# 씨앗 → 연관 키워드의 월 검색량(PC·모바일) + 블로그 문서수 → 경쟁강도·틈새 점수.

IT:
  - 영상편집 노트북
  - 인강용 태블릿
  - 사무용 노트북
  - 27인치 모니터
  - 게이밍 모니터
  - 무선이어폰 추천
  - 노이즈캔슬링 이어폰
  - 기계식 키보드
  - 맥북 허브
  - 외장 SSD
  - 가성비 태블릿
  - 휴대용 모니터

골프:
  - 골프 거리측정기
  - 스윙 연습기
  - 퍼팅 매트
  - 골프공 추천
  - 골프 장갑
  - 골프화
  - 골프 가방
  - 가성비 골프채
  - 홈 골프 연습기
  - 골프 의류
  - 골프 입문 장비
  - 골프 우산

settings:
  per_group_cap: 30    # 그룹마다 문서수까지 조사할 키워드 최대 개수(연관 포함)
  min_volume: 300      # 월 검색량(PC+모바일) 이 미만이면 제외(롱테일 보려고 낮춤)
