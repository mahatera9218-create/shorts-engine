# 틈새 키워드 조사 씨앗 (market.niche 전용). 대표 2026-10-23.
# 금·환율(엔화/달러)은 사실상 고정이라 조사 안 함 — 증시(바뀌는 핫종목)와 부동산만 조사한다.
# 증시: 지금 화제인 종목·테마를 자주 갱신. 부동산: 검색량 높고 경쟁강도 낮은 것 찾기.
# 씨앗을 넣으면 그 씨앗 + 연관 키워드의 월 검색량(PC·모바일)·블로그 문서수·경쟁강도를 잰다.

증시:
  - SK하이닉스
  - 삼성전자
  - 두산에너빌리티
  - 한화에어로스페이스
  - 에코프로비엠
  - 코스피 전망
  - 반도체 관련주

부동산:
  - 분당 재건축
  - 동탄 청약
  - 계양 신도시 청약
  - 주택담보대출 금리
  - 전세 사기
  - 재건축 초과이익환수
  - 1주택 양도세

settings:
  per_group_cap: 40    # 그룹마다 문서수까지 조사할 키워드 최대 개수(연관 포함, API 호출 수 제한)
  min_volume: 500      # 월 검색량(PC+모바일) 이 미만이면 제외
