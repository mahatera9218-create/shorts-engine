# 순위·총정리형 글 (대표 결정 2026-09-30, 양찬군주 벤치마크): 주 1~2편, 정한 요일의 첫 후보 1편을 순위 글로.
# 숫자는 확인 연봉표(config/salaries.yaml)만 쓴다 (뉴스 수집·추측 없음). 순위는 여기 적은 선수 안에서만 매긴다.
# players: 순위라고 말해도 되는 범위만 적는다 (발표·보도로 그 순위가 확인된 선수). 확인 못 한 선수를 끼워 'TOP N'이라 하지 않는다.
# complete: true면 "N위"라고 부르고, false면 "N명 중 N위"·"주요 선수 N명 비교"로만 부른다 (전체 순위가 아님).
# season: 목록의 시즌 표기 (없으면 연봉표 season). teams: 선수 풀에 없는 선수의 소속팀.
days: [2, 5]        # 요일 (월=0): 수·토
repeat_days: 21     # 같은 목록은 21일 안에 다시 쓰지 않는다
lists:
