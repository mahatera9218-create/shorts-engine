# 운영 블로그 2개: 경제 + 연예인 패션 (대표 결정 2026-10-05, 같은 날 연예·패션을 하나로 합침 — 강사 프롬프트가 "연예인 패션" 한 주제라서). 도우미 탭·버튼 이름(label)·데이터 폴더·프롬프트·말투가 여기서 정해진다.
# label: 도우미 버튼이 여는 이슈 제목 앞말 ([경제키워드], [패션발행완료] …)
econ:
  label: 경제
  name: 억선생의 경제판        # 블로그 이름·프로필은 대표가 직접 고침
  url: https://blog.naver.com/eokconomy
  dir: econ                   # 데이터 폴더 (flow/·posts/)
  prompt: prompts/kunine-blog.md
  addon: prompts/kunine-addon.md
  keywords: config/econ_keywords.yaml
  title_masters: [kka_dream]   # 제목 고수 참고: 경제토르 (config/title_masters.yaml, 2026-10-05)
fashion:
  label: 패션
  name: 캐시미어 다이어리     # 대표 확정 2026-10-05
  nick: 캐다
  url: https://blog.naver.com/tenbillionsound   # 대표 2026-10-05 (예전 스포츠 글은 대표가 다 지움)
  dir: blogs/fashion
  prompt: prompts/ent-fashion-blog.md
  addon: prompts/addon-fashion.md
  keywords: config/keywords_fashion.yaml
  title_masters: [influha]     # 제목 고수 참고: 유미 (셀럽 패션형 제목)
