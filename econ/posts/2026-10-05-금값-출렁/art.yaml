- file: summary.png
  prompt: >-
    Wide 3:2 blog illustration, no text, no numbers. Three Korean hwatu-style flower cards with rounded corners,
    slightly fanned, on a cream hanji background: card 1 = a string of brass yeopjeon coins hanging from a black pine
    branch with a red sun; card 2 = a wooden Joseon coin chest with a red tassel under red maple leaves and a small
    deer; card 3 = black willow branches in slanted rain with a red lightning bolt and a small frog. Bold flat colors,
    thick black outlines.
