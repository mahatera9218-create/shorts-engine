main: zkfldb888
main_profile: 1) 주인공은 글 주제에 바로 붙는 '실물 한 장'을 고른다. 이슈 인물은 기자회견·제작보고회·인터뷰 현장 인물 사진(상반신 클로즈업 1장, 단체 컷 1장, 발언 장면 1장), 기업은 사옥·공장 간판, 자산은 금괴·금화 같은 사물, 환율은 환전소 거리, 정책 이슈는 기자회견장 현수막이다. 차트와 표는 8장 중 한 장도 없다. 2) 실사가 압도적이다(보도·현장·스톡 사진 7장). AI 생성으로 보이는 이미지는 비트코인 1장뿐이고, 간판 글자가 살짝 깨져 보인다. 3) 모든 썸네일은 정사각 365px 중앙 크롭이다. 인물은 얼굴·마이크를 중앙 가까이에 두고, 사물은 화면을 가득 채우며, 건물은 간판을 중앙에 둔다. 4) 편집으로 얹은 글자는 없다. 보이는 글자는 원본 속 자막, 행사 배너, 현수막, 간판뿐이고, 제목은 본문 제목 줄이 맡는다. 5) 색감은 보정 없이 원본 그대로다. 어두운 배경(검정·회색)과 금색·네온 같은 강한 색 대비가 많고, 비트코인 이미지는 황금빛 노을 톤이다. 6) 주제와 그림은 직설적으로 잇는다. 제목에 나온 대상(영화 출연자, 삼성전기, 금, 엔화, 정년연장)을 그대로 화면에 보여 주며, 비유나 은유 이미지는 없다. 7) 우리가 따라 할 때는 구도 규칙(대상 1개 중앙 배치, 정사각, 글자 없음, 제목 대상 직결)은 유지하고 화풍만 바꾼다. 예를 들어 같은 대상을 일러스트·3D·수채 같은 통일된 한 가지 그림체로 그리거나, 저작권이 안전한 자체 촬영·생성 이미지로 대체한다. 8) 위 내용은 8장의 보이는 특징이며, 글자 폰트나 보정 값은 RSS로 알 수 없다.
