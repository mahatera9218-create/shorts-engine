# 필수 페이지 올리기 (개인정보·약관·면책·연락처·소개) — 워드프레스 없이 사이트 파일로
# - 수동 실행: Actions → 필수 페이지 → Run workflow
# - reports/구글-페이지/*.md 를 web/content/pages/ 로 변환해 main에 커밋 → Vercel 배포.
# - 안전장치: 이메일 자리표({{EMAIL}})가 남아 있으면 멈춘다(미완성 페이지 방지).
name: 필수 페이지

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "reports/구글-페이지/**"

permissions:
  contents: write

concurrency:
  group: site-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 자리표 확인 (이메일 안 채웠으면 멈춤)
        run: |
          if grep -rl "{{EMAIL}}" reports/구글-페이지/ >/dev/null 2>&1; then
            echo "❌ 아직 이메일 자리표({{EMAIL}})가 남아 있습니다. 채운 뒤 실행하세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: 페이지 변환
        run: |
          set -o pipefail
          python -m content.publish_fs --pages --max 0 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/pages
          if git diff --cached --quiet; then
            echo "페이지 변경 없음 — 커밋 생략." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "필수 페이지 갱신 ($(date +%F))"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main \
              && git push origin HEAD:main \
              && { echo "✅ 페이지 반영 완료." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep $((i * 3))
          done
          exit 1
