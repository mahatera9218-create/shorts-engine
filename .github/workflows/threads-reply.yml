# Threads 댓글 후보 — 우리 글과 관련된 공개 글을 공식 키워드 검색으로 찾고 댓글 초안을 만든다.
# - 자동으로 댓글을 달지 않는다(스팸·제재 위험). reports/threads-reply-queue.md 에 모아 대표가 직접 붙여넣기.
# - THREADS_ACCESS_TOKEN(threads_keyword_search 권한 필요)·ANTHROPIC_API_KEY. 없으면 조용히 생략.
name: Threads 댓글 후보

on:
  workflow_dispatch:
  # 자동 스케줄 끔(2026-10-17 대표 지시, Threads 보류). 토큰 발급 후 아래 주석을 풀면 다시 돈다.
  # schedule:
  #   - cron: "37 1 * * *"    # KST 10:37 하루 1회

permissions:
  contents: write

concurrency:
  group: threads-reply
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 후보 찾기
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          python -m content.threads_reply | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/threads-reply-queue.md reports/threads-reply-seen.json reports/costs.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "새 후보 없음." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git commit -m "Threads 댓글 후보 ($(date +%F))"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
