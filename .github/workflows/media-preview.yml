# 영상 미리보기: 클립·쇼츠 제작 방식을 바꾼 뒤 실제 배경 영상·선수 사진·목소리로 한 번 만들어 본다.
# 자동: config/preview.yaml을 고쳐 main에 올리면. 수동: Actions → 영상 미리보기 → Run workflow
name: 영상 미리보기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/preview.yaml"]

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-nanum-extra ffmpeg > /dev/null
          pip install -r requirements.txt
      - name: 클립 다시 만들기 (오늘 후보)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          set -o pipefail
          for f in posts/$(date +%F)-*/; do [ -f "$f/clip.json" ] && python -m content.clip "$f"; done | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: 쇼츠 미리보기 3개 (기록에 안 남김, 도우미에 '미리보기 · 올리지 마세요'로 보임)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          set -o pipefail
          python -m content.shorts --preview | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts/ shorts/ config/player_photos.yaml 2>/dev/null || git add -A posts/ shorts/
          if git diff --cached --quiet; then
            echo "바뀐 결과 없음"
          else
            git commit -m "영상 미리보기 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi

  desk:
    needs: preview
    uses: ./.github/workflows/desk.yml
    secrets: inherit
