# 이미 만든 글의 이미지 다시 그리기 (썸네일 디자인을 바꿨을 때, Pexels 사진 넣기)
# - 수동 실행: Actions → 이미지 다시 그리기 → Run workflow
name: 이미지 다시 그리기

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "글 폴더 이름 (비우면 posts/ 전부)"
        type: string
        required: false
  workflow_call:   # 발행 도우미 "사진·클립 다시 그리기" 버튼 (desk-button.yml)

permissions:
  contents: write
  actions: read

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-nanum-extra ffmpeg > /dev/null
          pip install -r requirements.txt
      - name: 영상 받기 (영상은 저장소가 아니라 캐시에 둔다, 2026-09-30)
        uses: actions/cache/restore@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-r
          restore-keys: media-
      - name: 다시 그리기
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          FOLDER: ${{ inputs.folder }}
        run: |
          if [ -n "$FOLDER" ]; then python -m content.rebuild "posts/$FOLDER"; else python -m content.rebuild; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 저장 (posts/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/; [ -e config/player_photos.yaml ] && git add config/player_photos.yaml
          if git diff --cached --quiet; then
            echo "바뀐 이미지 없음"
          else
            git commit -m "이미지 다시 그리기 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            echo "결과를 저장하지 못했습니다. Claude에게 알려주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: 캐시 표시
        if: always()
        run: mkdir -p .cache && date > .cache/media.txt
      - name: 새 영상 넘기기 (같은 실행의 도우미 배포용. 버튼으로 돈 실행은 캐시 저장이 막힐 때가 있다, 2026-10-01)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: media-new
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: 영상 캐시 저장
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  desk:
    needs: rebuild
    if: ${{ always() && needs.rebuild.result == 'success' }}
    uses: ./.github/workflows/desk.yml
    secrets: inherit
