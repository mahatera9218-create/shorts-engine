# 경제 상위 블로그 벤치마크 (2026-10-04): 활성 방문자 많은 경제 블로그는 뭘 어떻게 쓰나 → reports/블로그-벤치마크/
# 자동: config/econ_bench.yaml을 고쳐 main에 올리면. 수동: Actions → 경제 블로그 벤치마크
name: 경제 블로그 벤치마크

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/econ_bench.yaml"]

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  econ-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 경제 블로그 벤치마크
        env:
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: |
          set -o pipefail
          python -m market.econ_bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 저장 (reports/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "바뀐 결과 없음"
          else
            git commit -m "블로그 벤치마크 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
