# 광고 묶음별 광고주 수요(검색량·경쟁도·중간 입찰가) 재기 → reports/광고/
# 자동: config/ad_keywords.yaml을 고쳐 main에 올리면 실행. 수동: Actions → 광고 단가 → Run workflow
name: 광고 단가

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/ad_keywords.yaml"]

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  ad-value:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 광고 단가 재기
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: python -m market.ad_value | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 저장 (reports/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "바뀐 결과 없음"
          else
            git commit -m "광고 단가 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
