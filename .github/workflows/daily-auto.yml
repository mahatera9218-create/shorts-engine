# 매일 키워드 모으기 (대표 결정 2026-10-07, 2026-10-09부터 자동 글 없음: 키워드·제목은 대표가 고름)
# - 05:17 경제·패션 키워드 모으기·채점 (06시 전에 끝나게)
# - 어사이드가 키워드를 올리면 desk-button.yml이 넣고 다시 채점
name: 매일 자동 글

on:
  schedule:
    # 키워드 모으기 — GitHub 예약이 자주 늦거나 건너뛰어(10-09·10-10 둘 다 안 돎) 한국 새벽에 3번 시도.
    # 그날 이미 모였으면 다시 모아도 어사이드·대표가 넣은 건 유지되고 Grok만 새로 받으니 문제없음 (2026-10-10).
    # 발행 9·12·18시 3시간 전에 키워드가 나오게 (대표 결정 2026-10-10). 아침은 Grok 새로, 낮·저녁은 무료 신호(급상승·검색량·유튜브)로 다시 채점
    - cron: "40 20 * * *"   # UTC 20:40 = 한국 05:40 (9시 발행용)
    - cron: "40 23 * * *"   # UTC 23:40 = 한국 08:40 (12시 발행용)
    - cron: "40 5 * * *"    # UTC 05:40 = 한국 14:40 (18시 발행용)
    # 10시 자동 글은 끔 (대표 결정 2026-10-09: 키워드·제목은 대표가 고름)

permissions:
  contents: write

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        blog: [econ, fashion]
    uses: ./.github/workflows/econ-flow.yml
    with:
      cmd: keywords
      blog: ${{ matrix.blog }}
    secrets: inherit
