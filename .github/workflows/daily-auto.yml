# 매일 키워드 모으기 (대표 결정 2026-10-07, 2026-10-09부터 자동 글 없음: 키워드·제목은 대표가 고름)
# - 05:17 경제·패션 키워드 모으기·채점 (06시 전에 끝나게)
# - 어사이드가 키워드를 올리면 desk-button.yml이 넣고 다시 채점
name: 매일 자동 글

on:
  schedule:
    - cron: "17 20 * * *"   # UTC 20:17 = 한국 05:17 키워드 모으기 (정각은 GitHub가 몇 시간씩 늦게 돌려 2026-10-09 옮김)
    # 10시 자동 글은 끔 (대표 결정 2026-10-09: 키워드·제목은 대표가 고름)

permissions:
  contents: write

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        blog: [econ, fashion]
    uses: ./.github/workflows/econ-flow.yml
    with:
      cmd: keywords
      blog: ${{ matrix.blog }}
    secrets: inherit
