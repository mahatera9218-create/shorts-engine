# 네이버 쇼핑 검색 점검 (2026-10-08): content/shop_price.py가 바뀌면 실제로 불러 보고 reports/에 남김 (AI 비용 없음)
name: 쇼핑 검색 점검

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/shop_price.py"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행
        env:
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
          BLOG: fashion
        run: python -m content.shop_price
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "쇼핑 검색 점검: $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
