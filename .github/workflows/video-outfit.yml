# 방송 클립 착장 조사 시험 (대표 요청 2026-10-08, content/video_outfit.py)
# 유튜브 공식 API로 찾고 Gemini가 유튜브 주소를 직접 봄(영상 다운로드 없음) → Grok이 브랜드·가격 확인 → reports/에 저장
name: 방송 착장 조사 시험

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/video_outfit.yaml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          BLOG: fashion
        run: python -m content.video_outfit
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "방송 착장 조사 시험: $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
