# 쇼츠 성과 수집 (평소엔 매일 아침 자동 글쓰기 안에서 돈다)
# 자동: config/youtube.yaml을 고쳐 main에 올리면 한 번. 수동: Actions → 쇼츠 성과 → Run workflow
name: 쇼츠 성과

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/youtube.yaml", "content/shorts_stats.py"]

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 영상 받기 (영상은 저장소가 아니라 캐시에 둔다, 2026-09-30)
        uses: actions/cache/restore@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-r
          restore-keys: media-
      - name: 쇼츠 성과 수집
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -o pipefail   # 수집이 실패하면 ❌로 보이게 (tee가 실패를 가리지 않게)
          python -m content.shorts_stats | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ shorts/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 결과 없음"
          else
            git commit -m "쇼츠 성과 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
      - name: 캐시 표시
        if: always()
        run: mkdir -p .cache && date > .cache/media.txt
      - name: 영상 캐시 저장
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
