# 시장조사 (설계서 0.3 최소 버전, KICKOFF 1주차 7번)
# - 수동 실행: GitHub 앱/브라우저 → Actions → 시장조사 → Run workflow
# - 자동 실행: 매주 월요일 오전 8시 47분 (한국 시간)
# 결과는 reports/에 커밋되고, 실행 요약(Summary)에도 핵심이 남는다.
name: 시장조사

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식 (실제 = API 키 필요, 예시 = 키 없이 모양만 확인)"
        type: choice
        options: [실제, 예시]
        default: 실제
  # schedule:   # 2026-10-05 대표 결정: 스포츠 자동 중단 (경제 전향)
  #   - cron: "47 23 * * 0"   # UTC 일요일 23:47 = 한국 월요일 08:47

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 준비
        run: pip install -r requirements.txt

      - name: 점검 (테스트)
        run: python -m unittest discover -s tests

      - name: 시장조사 실행
        env:
          # 이름은 KICKOFF.md 규칙 2와 같다. 값은 GitHub Secrets에만 있다.
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "예시" ]; then
            python -m market.run --sample
          else
            python -m market.run
          fi

      - name: 결과 저장 (reports/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "바뀐 결과 없음"
          else
            git commit -m "시장조사 결과 $(date +%F)"
            # 실행 중에 main이 바뀌었으면 최신을 받아 결과 커밋을 그 위에 올린 뒤 올린다 (최대 3번).
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            echo "결과를 저장하지 못했습니다. Claude에게 알려주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
