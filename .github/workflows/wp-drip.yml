# 구글 글 드립 공개 (워드프레스 없이 — 저장소 글 파일로 발행)
# - 대기 글(reports/구글글-초안/*.md)을 불규칙한 시각에 하나씩 사이트용으로 변환해
#   web/content/posts/ 에 쓰고 main에 커밋한다. 커밋되면 Vercel이 자동 배포 → 사이트 반영.
# - 중복은 slug로 거른다(이미 web/content/posts/에 있으면 건너뜀). 하루 상한 3편.
# - 끄려면 이 워크플로를 비활성화. 비밀 값·외부 서버 불필요(순수 파일 작업).
name: 구글 글 드립 공개

on:
  workflow_dispatch:
    inputs:
      force:
        description: "지금 바로 (하루 상한 무시)"
        type: boolean
        default: false
  schedule:
    # 불규칙한 KST 시각(UTC). 하루 상한(3)과 합쳐 몰리지 않게 2~3편.
    - cron: "17 23 * * *"   # KST 08:17
    - cron: "41 1 * * *"    # KST 10:41
    - cron: "43 3 * * *"    # KST 12:43
    - cron: "9 7 * * *"     # KST 16:09
    - cron: "31 10 * * *"   # KST 19:31
    - cron: "53 12 * * *"   # KST 21:53

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 점검 (테스트)
        run: python -m unittest tests.test_wp
      - name: 발행 (초안 → 사이트 글 파일)
        run: |
          set -o pipefail
          if [ "${{ inputs.force }}" = "true" ]; then FLAG=--force; else FLAG=""; fi
          python -m content.publish_fs $FLAG | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 커밋·푸시 (새 글 있으면 배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/posts
          if git diff --cached --quiet; then
            echo "새로 발행된 글 없음 — 커밋 생략." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "드립 발행: 새 글 공개 ($(date +%F))"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main \
              && git push origin HEAD:main \
              && { echo "✅ 발행 완료 — 곧 사이트에 반영됩니다." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep $((i * 3))
          done
          echo "❌ 푸시 실패(네트워크). 다음 예약 때 재시도됩니다." >> "$GITHUB_STEP_SUMMARY"
          exit 1
