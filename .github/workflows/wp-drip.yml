# 구글 글 드립 공개 (워드프레스 없이 — 저장소 글 파일로 발행)
# - 대기 글(reports/구글글-초안/*.md)을 불규칙한 시각에 하나씩 사이트용으로 변환해
#   web/content/posts/ 에 쓰고 main에 커밋한다. 커밋되면 Vercel이 자동 배포 → 사이트 반영.
# - 중복은 slug로 거른다(이미 web/content/posts/에 있으면 건너뜀). 하루 5편(아침·오전·점심·오후·저녁). '검증: 미확인' 초안은 발행하지 않는다.
# - 끄려면 이 워크플로를 비활성화. 비밀 값·외부 서버 불필요(순수 파일 작업).
name: 구글 글 드립 공개

on:
  workflow_dispatch:
    inputs:
      force:
        description: "지금 바로 (하루 상한 무시)"
        type: boolean
        default: false
  schedule:
    # 하루 8편: 구간 8개(09~22시 2시간 단위)에 1편씩(2026-10-26 대표 결정, 발행량 증량·카테고리 균등).
    # 각 구간에 두 번씩 걸어 두고, 이미 그 구간 글이 나갔으면 건너뛴다(content.publish_fs의 구간 규칙).
    # 발행은 '가장 뒤처진 카테고리'부터 → 세금 쏠림 없이 수를 맞춘다. KST=UTC+9.
    - cron: "10 0 * * *"    # KST 09:10 (s1)
    - cron: "40 0 * * *"    # KST 09:40 (s1 재시도)
    - cron: "40 1 * * *"    # KST 10:40 (s2)
    - cron: "10 2 * * *"    # KST 11:10 (s2 재시도)
    - cron: "20 3 * * *"    # KST 12:20 (s3)
    - cron: "50 3 * * *"    # KST 12:50 (s3 재시도)
    - cron: "15 5 * * *"    # KST 14:15 (s4)
    - cron: "45 5 * * *"    # KST 14:45 (s4 재시도)
    - cron: "10 7 * * *"    # KST 16:10 (s5)
    - cron: "40 7 * * *"    # KST 16:40 (s5 재시도)
    - cron: "20 9 * * *"    # KST 18:20 (s6)
    - cron: "50 9 * * *"    # KST 18:50 (s6 재시도)
    - cron: "15 11 * * *"   # KST 20:15 (s7)
    - cron: "45 11 * * *"   # KST 20:45 (s7 재시도)
    - cron: "10 13 * * *"   # KST 22:10 (s8)
    - cron: "40 13 * * *"   # KST 22:40 (s8 재시도)

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 점검 (테스트)
        run: python -m unittest tests.test_wp
      - name: 발행 (초안 → 사이트 글 파일)
        run: |
          set -o pipefail
          if [ "${{ inputs.force }}" = "true" ]; then FLAG=--force; else FLAG=""; fi
          python -m content.publish_fs $FLAG | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 커밋·푸시 (새 글 있으면 배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/posts
          if git diff --cached --quiet; then
            echo "새로 발행된 글 없음 — 커밋 생략." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "드립 발행: 새 글 공개 ($(date +%F))"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main \
              && git push origin HEAD:main \
              && { echo "✅ 발행 완료 — 곧 사이트에 반영됩니다." >> "$GITHUB_STEP_SUMMARY"; touch /tmp/published; break; }
            sleep $((i * 3))
          done
          [ -f /tmp/published ] && exit 0
          echo "❌ 푸시 실패(네트워크). 다음 예약 때 재시도됩니다." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: 검색엔진에 알리기 (IndexNow — 네이버·빙)
        run: |
          [ -f /tmp/published ] || exit 0
          sleep 150   # Vercel 배포가 끝난 뒤 알린다
          python -m content.indexnow --new | tee -a "$GITHUB_STEP_SUMMARY" || true
