# 발행 도우미 페이지를 Cloudflare Pages에 올린다 (posts/ → 태블릿용 페이지)
# - 자동: 글쓰기·이미지 다시 그리기 워크플로가 끝나면 호출, posts/가 바뀐 push
# - 수동: Actions → 발행 도우미 배포 → Run workflow
# 키: CLOUDFLARE_API_TOKEN (Cloudflare Pages 편집 권한), CLOUDFLARE_ACCOUNT_ID
name: 발행 도우미 배포

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["posts/**", "shorts/**", "content/desk.py", ".github/workflows/desk.yml"]

permissions:
  contents: read
  actions: read   # 최근 실행의 새 영상(아티팩트) 받기

concurrency:
  group: desk-deploy
  cancel-in-progress: false

env:
  PROJECT: eoksori-desk

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 방금 커밋된 새 글까지 받기
      - name: 영상 받기 (영상은 저장소가 아니라 캐시에 둔다, 2026-09-30)
        uses: actions/cache/restore@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-r
          restore-keys: media-
      - name: 최근 실행의 새 영상 받기 (버튼으로 돈 실행은 캐시 저장이 막혀 아티팩트로만 남는다, 2026-10-01)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=media-new&per_page=6" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | .[].workflow_run.id')
          for id in $ids; do   # 오래된 것부터 → 새 영상이 덮어쓴다
            rm -rf "$RUNNER_TEMP/mn" && gh run download "$id" -n media-new -D "$RUNNER_TEMP/mn" -R "$GITHUB_REPOSITORY" && cp -r "$RUNNER_TEMP/mn/." . || true
          done
          ls posts/*/clip.mp4 2>/dev/null | wc -l
      - name: 새 영상 받기 (같은 실행에서 방금 만든 영상, 없으면 넘어감)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: media-new
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 페이지 만들기
        run: |
          pip install -r requirements.txt
          python -m content.desk site
      - name: Cloudflare Pages에 올리기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "⚠️ Cloudflare 키가 없어 발행 도우미를 올리지 않았습니다 (docs/운영자-안내-발행-도우미.md)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail   # 올리기가 실패하면 ❌로 표시되게 (tee가 실패를 가리지 않게)
          # 복사할 때 공백·줄바꿈·주소 전체가 같이 들어가도 32자리 계정 ID만 골라 쓴다
          ACC=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -1 || true)
          if [ -z "$ACC" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID 형식이 이상합니다. 32자리 영문·숫자만 다시 넣어 주세요 (docs/운영자-안내-발행-도우미.md ②)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::add-mask::$ACC"   # 정리한 값도 로그에 안 보이게
          export CLOUDFLARE_ACCOUNT_ID="$ACC"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          ok=""
          for wait in 20 60 120; do   # Cloudflare가 "요청이 많다(10429)"고 하면 쉬었다가 다시
            sleep "$wait"
            if npx --yes wrangler@4 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true | tee deploy.log; then
              ok=1; break
            fi
          done
          if [ -z "$ok" ]; then
            echo "❌ 발행 도우미를 올리지 못했습니다. Claude에게 알려주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "## 발행 도우미" >> "$GITHUB_STEP_SUMMARY"
          echo "고정 주소: https://$PROJECT.pages.dev (이번 배포: $url)" >> "$GITHUB_STEP_SUMMARY"
