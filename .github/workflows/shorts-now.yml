# 쇼츠만 지금 만들기 (2026-10-01): GitHub 예약 실행이 늦거나 안 돌아 그날 쇼츠가 없을 때.
# config/shorts_now.yaml 값을 바꿔 main에 올리면 돈다 (글은 쓰지 않음, Claude 비용 없음). 안 올린 쇼츠가 있는 칸은 건너뜀.
name: 쇼츠 지금 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/shorts_now.yaml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-nanum-extra ffmpeg > /dev/null
          pip install -r requirements.txt
      - name: 영상 받기
        uses: actions/cache/restore@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-r
          restore-keys: media-
      - name: 쇼츠 성과 수집
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m content.shorts_stats | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 유튜브 쇼츠 A·B·C
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python -m content.shorts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d shorts ] && git add -A shorts/; [ -d "reports/쇼츠-성과" ] && git add "reports/쇼츠-성과"; [ -e config/player_photos.yaml ] && git add config/player_photos.yaml
          git diff --cached --quiet && exit 0
          git commit -m "쇼츠 $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: 캐시 표시
        if: always()
        run: mkdir -p .cache && date > .cache/media.txt
      - name: 새 영상 넘기기
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: media-new
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: 영상 캐시 저장
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  desk:
    needs: shorts
    if: ${{ always() && needs.shorts.result != 'skipped' }}
    uses: ./.github/workflows/desk.yml
    secrets: inherit
