# 글 1편 발행 (워드프레스 없이 — 지정한 초안을 사이트 글로)
# - 수동 실행: Actions → 글 1편 발행 → Run workflow → 글파일 경로 입력
# - 지정한 reports/구글글-초안/*.md 를 web/content/posts/ 로 변환해 main에 커밋 → Vercel 배포.
# - 평소 발행은 '구글 글 드립 공개'(자동)가 맡는다. 이건 특정 글을 바로 올리고 싶을 때.
name: 글 1편 발행

on:
  workflow_dispatch:
    inputs:
      file:
        description: "올릴 글파일 경로"
        type: string
        default: "reports/구글글-초안/01-소득세율표.md"

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 점검 (테스트)
        run: python -m unittest tests.test_wp
      - name: 발행 (지정 초안 → 사이트 글 파일)
        run: |
          set -o pipefail
          python -m content.publish_fs --file "${{ inputs.file }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/posts
          if git diff --cached --quiet; then
            echo "변경 없음(이미 발행된 글일 수 있음) — 커밋 생략." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "글 1편 발행 ($(date +%F))"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main \
              && git push origin HEAD:main \
              && { echo "✅ 발행 완료 — 곧 사이트에 반영됩니다." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep $((i * 3))
          done
          exit 1
