# 억선생의 경제판 발행 도우미를 Cloudflare Pages에 올린다 (econ/posts/ → 휴대폰용 페이지, 홈 화면에 추가해서 씀)
# - 자동: econ/ 또는 content/econ_desk.py가 바뀐 push, 발행 완료 버튼 처리 뒤 호출
# - 수동: Actions → 경제 발행 도우미 배포 → Run workflow
# 키: 스포츠 도우미와 같은 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: 경제 발행 도우미 배포

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["econ/**", "blogs/**", "content/econ_desk.py", "content/desk.py", "assets/brand/desk-icon-*", ".github/workflows/econ-desk.yml"]

permissions:
  contents: read

concurrency:
  group: econ-desk-deploy
  cancel-in-progress: false

env:
  PROJECT: eok-econ-desk

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 페이지 만들기
        env:  # 인물 사진 후보 (네이버 이미지 검색 API, 2026-10-06)
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: |
          pip install -r requirements.txt
          python -m content.econ_desk site-econ
      - name: Cloudflare Pages에 올리기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "⚠️ Cloudflare 키가 없어 올리지 않았습니다" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          set -o pipefail
          ACC=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -1 || true)
          [ -z "$ACC" ] && { echo "❌ CLOUDFLARE_ACCOUNT_ID 형식이 이상합니다" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "::add-mask::$ACC"
          export CLOUDFLARE_ACCOUNT_ID="$ACC"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          ok=""
          for wait in 5 60 120; do   # Cloudflare가 "요청이 많다"고 하면 쉬었다가 다시
            sleep "$wait"
            if npx --yes wrangler@4 pages deploy site-econ --project-name "$PROJECT" --branch main --commit-dirty=true | tee deploy.log; then
              ok=1; break
            fi
          done
          [ -z "$ok" ] && { echo "❌ 경제 발행 도우미를 올리지 못했습니다. Claude에게 알려주세요." >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "## 억선생의 경제판 발행 도우미" >> "$GITHUB_STEP_SUMMARY"
          echo "고정 주소: https://$PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"
