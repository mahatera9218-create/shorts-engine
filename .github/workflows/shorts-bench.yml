# 쇼츠 벤치마크: 한국에서 잘 되는 스포츠 돈 쇼츠의 숫자(조회수·길이·제목·구독자) → reports/쇼츠-벤치마크/
# 자동: 매주 월요일 오전 8시 37분(한국) + config/shorts_bench.yaml 또는 market/shorts_bench.py를 고쳐 main에 올리면. 수동: Actions → 쇼츠 벤치마크 → Run workflow
name: 쇼츠 벤치마크

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/shorts_bench.yaml", "market/shorts_bench.py"]
  schedule:
    - cron: "37 23 * * 0"   # UTC 일요일 23:37 = 한국 월요일 08:37 (주간 점검 전에)

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 쇼츠 벤치마크
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m market.shorts_bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 저장 (reports/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "바뀐 결과 없음"
          else
            git commit -m "쇼츠 벤치마크 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
