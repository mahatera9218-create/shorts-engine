# 발행 도우미 버튼 처리 (대표 결정 2026-09-30)
# 도우미 글 화면의 [✅ 발행 완료 표시] / [다른 글로 다시 뽑기]가 제목이 채워진 이슈 작성 화면을 연다.
# 대표가 Create를 누르면: posts/<글>/status.yaml에 표시(content/mark.py) → 이슈 자동 닫힘
#   - 발행완료: 도우미 목록에서 "발행한 글"로 (중복 발행 방지)
#   - 다시뽑기: 목록에서 빼고, 다른 선수·테마로 새 글 1편을 바로 쓴다 (자동 글쓰기 --again)
# 도우미 첫 화면 버튼 (글 폴더 없이):
#   - [다시그리기]: 글은 그대로 두고 사진·썸네일·클립만 새로 그린다 (이미지 다시 그리기, Claude 비용 없음)
#   - [새후보]: 오늘 후보 4편을 더 쓴다 (자동 글쓰기 --again, Claude 비용 듦)
#   - [선수] <이름>: 대표가 찍은 선수로 바로 한 편 (2026-10-03). 본문 "사건: ..." 한 줄은 첫 문단 훅. 테마는 영수증(연봉 쪼개기)
# 글 화면 [💾 고친 내용 저장] (2026-09-30):
#   - [수정] <글>: 이슈 본문의 고친 제목·문단을 글에 반영 (content/edits.py) → 도우미 다시 올림
# 쇼츠 모음 버튼:
#   - [쇼츠버림] <폴더>: 올리지 않을 쇼츠를 버린다 → 그 형식이 다음 날 새로 만들어진다
# 저장소 주인이 만든 이슈만 처리한다.
name: 발행 도우미 버튼

on:
  issues:
    types: [opened]
  issue_comment:   # 대표가 '[선수]' 이슈에 연봉을 댓글로 달면 연봉표에 넣고 다시 쓴다 (2026-10-03)
    types: [created]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: desk-button
  cancel-in-progress: false

jobs:
  mark:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[발행완료]') || startsWith(github.event.issue.title, '[다시뽑기]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.m.outputs.action }}
      marketer: ${{ steps.m.outputs.marketer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 표시 남기기
        id: m
        env:
          TITLE: ${{ github.event.issue.title }}   # 제목은 셸에 직접 넣지 않고 환경 변수로만
        run: python -m content.mark --title "$TITLE"
      - name: 저장 (posts/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet && exit 0
          git commit -m "발행 도우미: ${{ steps.m.outputs.action }} ${{ steps.m.outputs.folder }}"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: 이슈 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          ACTION: ${{ steps.m.outputs.action }}
        run: |
          if [ "$ACTION" = "rejected" ]; then msg="이 글은 뺐어요. 다른 선수·테마로 새 글을 쓰는 중이에요 (5~10분 뒤 발행 도우미에 올라와요)."
          else msg="발행 완료로 표시했어요. 2~3분 뒤 발행 도우미 목록에서 '발행한 글'로 내려가요."; fi
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$msg"
      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "처리하지 못했어요. 이 화면을 Claude에게 알려주세요."

  write:
    needs: mark
    if: needs.mark.outputs.action == 'rejected'
    uses: ./.github/workflows/daily-post.yml
    with:
      mode: 실제
      again: true
      count: "1"
      marketer: ${{ needs.mark.outputs.marketer }}   # 버린 글을 쓴 마케터가 다시 (2026-10-01)
    secrets: inherit

  desk:   # 발행완료, 또는 다시 뽑기에서 새 글 쓰기가 실패했을 때도 목록은 갱신 (버린 글이 빠지게)
    needs: [mark, write]
    if: >-
      always() && needs.mark.result == 'success' &&
      (needs.mark.outputs.action == 'used' || needs.write.result == 'failure')
    uses: ./.github/workflows/desk.yml
    secrets: inherit

  econ-mark:   # 억선생의 경제판 도우미의 [✅ 발행 완료 표시] (2026-10-05)
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[경제발행완료]') || startsWith(github.event.issue.title, '[연예발행완료]') ||
       startsWith(github.event.issue.title, '[패션발행완료]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 표시 남기기
        id: m
        env:
          TITLE: ${{ github.event.issue.title }}   # 제목은 셸에 직접 넣지 않고 환경 변수로만
        run: python -m content.econ_desk --mark "$TITLE"
      - name: 저장 (econ/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in econ blogs; do [ -e "$d" ] && git add "$d"; done
          git diff --cached --quiet && exit 0
          git commit -m "발행 도우미: 발행 완료 ${{ steps.m.outputs.folder }}"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: 이슈 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "발행 완료로 표시했어요. 2~3분 뒤 도우미 목록에서 '발행한 글'로 내려가요."
      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "처리하지 못했어요. 이 화면을 Claude에게 알려주세요."

  econ-desk:
    needs: econ-mark
    uses: ./.github/workflows/econ-desk.yml
    secrets: inherit

  econ-inbox:   # 경제판 받은 편지함 (2026-10-05): [경제캡처] 어드바이저 캡처 · [경제참고] Aside 조사 · [경제수정] 고친 글
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[경제캡처]') || startsWith(github.event.issue.title, '[경제참고]') ||
       startsWith(github.event.issue.title, '[경제수정]') || startsWith(github.event.issue.title, '[연예수정]') ||
       startsWith(github.event.issue.title, '[패션수정]') || startsWith(github.event.issue.title, '[블로그통계]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 처리
        id: r
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}   # 제목·본문은 셸에 직접 넣지 않고 환경 변수로만
          BODY: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.txt"
          case "$TITLE" in
            "[경제캡처]"*) python -m content.econ_inbox capture "$NUM" ;;
            "[경제참고]"*) python -m content.econ_inbox ref "$RUNNER_TEMP/body.txt" ;;
            "[블로그통계]"*) python -m content.blog_stats "$RUNNER_TEMP/body.txt" ;;   # 어사이드가 읽은 네이버 블로그 통계 (2026-10-08)
            *) python -m content.econ_inbox edit "$TITLE" "$RUNNER_TEMP/body.txt" ;;   # [경제|연예|패션수정]
          esac
      - name: 저장 (econ/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in econ blogs; do [ -e "$d" ] && git add "$d"; done
          git diff --cached --quiet && exit 0
          git commit -m "경제 받은 편지함: 이슈 #${{ github.event.issue.number }}"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: 이슈 닫기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          MSG: ${{ steps.r.outputs.msg }}
          OK: ${{ job.status }}
        run: |
          if [ "$OK" = "success" ]; then msg="$MSG 2~3분 뒤 도우미에 보여요."
          else msg="처리하지 못했어요. 이 화면을 Claude에게 알려 주세요."; fi
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$msg"

  econ-inbox-desk:
    needs: econ-inbox
    uses: ./.github/workflows/econ-desk.yml
    secrets: inherit

  econ-parse:   # 억선생의 경제판 흐름 버튼 (2026-10-05): [경제키워드] · [경제키워드추가] · [경제키워드새로] · [경제제목]
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[경제키워드') || startsWith(github.event.issue.title, '[경제제목') ||
       startsWith(github.event.issue.title, '[패션키워드') || startsWith(github.event.issue.title, '[패션제목') ||
       startsWith(github.event.issue.title, '[경제자동') || startsWith(github.event.issue.title, '[패션자동'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cmd: ${{ steps.p.outputs.cmd }}
      arg1: ${{ steps.p.outputs.arg1 }}
      arg2: ${{ steps.p.outputs.arg2 }}
      blog: ${{ steps.p.outputs.blog }}
    steps:
      - name: 버튼 읽기
        id: p
        env:
          TITLE: ${{ github.event.issue.title }}   # 제목·본문은 셸에 직접 넣지 않고 환경 변수로만
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re
          t, b = os.environ["TITLE"].strip(), os.environ.get("BODY") or ""
          cmd = arg1 = arg2 = ""
          blog = {"경제": "econ", "패션": "fashion"}.get(t[1:3], "econ")  # [경제…]·[패션…] (2026-10-05, 연예는 패션에 합침)
          t = "[경제" + t[3:] if t[1:3] == "패션" else t  # 아래 판별은 경제 이름으로 통일
          if t.startswith("[경제키워드추가]"):
              cmd, arg1 = "add", "\n".join(l.strip() for l in b.splitlines() if l.strip() and "Create" not in l)[:800]
              if "어사이드" in t:   # 어사이드가 올린 홈판·인기글 목록 → 네이버 인기 점수 + 바로 자동 글 (대표 결정 2026-10-07)
                  cmd = "aside"
          elif t.startswith("[경제자동]"):   # 도우미 '자동 글 다시 돌리기'
              cmd, arg1 = "auto", "force"
          elif t.startswith("[경제키워드새로]"):
              cmd = "keywords"
          elif t.startswith("[경제제목새로]"):
              cmd, arg1 = "titles", t[len("[경제제목새로]"):].strip()[:60]
          elif t.startswith("[경제키워드]"):
              cmd, arg1 = "titles", t[len("[경제키워드]"):].strip()[:300]   # 여러 개는 " / "로 이어 옴 (2026-10-06)
          elif t.startswith("[경제제목]"):
              m = re.match(r"^\[경제제목\]\s*(\d{4}-\d{2}-\d{2}-[0-9A-Za-z가-힣-]+)\s+(\d{1,2})\s*$", t)
              if m: cmd, arg1, arg2 = "produce", m.group(1), m.group(2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"cmd={cmd}\narg1<<EOF_X\n{arg1}\nEOF_X\narg2={arg2}\nblog={blog}\n")
          PY
      - name: 이슈 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          CMD: ${{ steps.p.outputs.cmd }}
        run: |
          case "$CMD" in
            titles) msg="제목 후보를 만들고 있어요 (키워드 1개에 약 3~5분). 도우미의 ② 제목 고르기에 올라와요.";;
            produce) msg="이 제목으로 글·그림·쇼츠 대본을 만들고 있어요 (약 5~10분). 도우미 목록에 올라와요.";;
            add) msg="키워드를 도우미에 넣었어요 (1~2분).";;
            aside) msg="어사이드 키워드를 넣고 다시 채점했어요. 오늘 자동 글이 아직이면 1~3위로 바로 글을 만들어요 (약 30~40분).";;
            auto) msg="오늘 자동 글을 다시 만들고 있어요 (약 30~40분). 도우미 ③에 올라와요.";;
            keywords) msg="Grok과 코드로 키워드를 다시 모으고 있어요 (약 3분).";;
            *) msg="형식이 맞지 않아 처리하지 못했어요. Claude에게 알려 주세요.";;
          esac
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$msg"

  econ-run:
    needs: econ-parse
    if: needs.econ-parse.outputs.cmd != ''
    uses: ./.github/workflows/econ-flow.yml
    with:
      cmd: ${{ needs.econ-parse.outputs.cmd }}
      arg1: ${{ needs.econ-parse.outputs.arg1 }}
      arg2: ${{ needs.econ-parse.outputs.arg2 }}
      blog: ${{ needs.econ-parse.outputs.blog }}
    secrets: inherit

  designate:   # ⚡ 이 선수로 지금 쓰기 (대표 결정 2026-10-03): 대표가 찍은 선수를 바로 한 편
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[선수]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.p.outputs.name }}
      event: ${{ steps.p.outputs.event }}
      team: ${{ steps.p.outputs.team }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 이슈 파싱 (선수 이름·사건)
        id: p
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.txt"
          python -m content.designate --title "$TITLE" --body-file "$RUNNER_TEMP/body.txt" || true
      - name: 알림 (쓰는 중 / 형식 오류)
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          NAME: ${{ steps.p.outputs.name }}
        run: |
          if [ -n "$NAME" ]; then msg="$NAME 글을 지금 쓰는 중이에요 (15~20분). 다 되면 성공/실패를 이 이슈에 댓글로 알려드려요."
          else msg="선수 이름을 못 읽었어요. 제목이 '[선수] 이름' 모양인지 확인해 주세요."; fi
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$msg"

  designate-write:
    needs: designate
    if: needs.designate.outputs.name != ''
    uses: ./.github/workflows/daily-post.yml
    with:
      mode: 실제
      again: true          # 하루 한도 건너뛰고 바로 쓴다
      topic: ${{ needs.designate.outputs.name }}
      theme: life           # 지정 글은 생활 물가 비교 (연봉 vs 당일 검색량 상위 상품)
      event: ${{ needs.designate.outputs.event }}
      team: ${{ needs.designate.outputs.team }}
      trend: true           # 비교대상 = 당일 검색량 상위 소비재 (대표 지시 2026-10-03)
    secrets: inherit

  designate-report:   # 지정 글 결과 알림 (성공/실패, 2026-10-03): 실패해도 대표가 왜 안 나왔는지 알게
    needs: [designate, designate-write]
    if: always() && needs.designate.outputs.name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # designate-write가 올린 글까지
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 결과 확인·알림
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          NAME: ${{ needs.designate.outputs.name }}
        run: |
          made=$(python -m content.designate --check "$NAME")
          if [ "$made" = "made" ]; then
            msg="✅ $NAME 글이 올라왔어요. 발행 도우미 위쪽에서 블로그·클립·쇼츠를 확인하세요."
          else
            msg="⚠️ $NAME 글을 못 썼어요. 보통 **올해 연봉이 뉴스에 안 나올 때**예요 (계약 총액만 있고 1년치 연봉이 없는 경우 등). 다른 선수로 다시 해보시거나, 그 선수 연봉을 아시면 알려주시면 제가 연봉표에 넣을게요."
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$msg"

  salary:   # 대표가 '[선수]' 이슈에 연봉을 댓글로 달면 연봉표에 넣고 다시 쓴다 (대표 결정 2026-10-03)
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[선수]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.s.outputs.name }}
      event: ${{ steps.s.outputs.event }}
      team: ${{ steps.s.outputs.team }}
      added: ${{ steps.s.outputs.added }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 댓글에서 연봉 읽기
        id: s
        env:
          TITLE: ${{ github.event.issue.title }}     # 셸에 직접 넣지 않고 환경 변수로만
          BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.txt"
          printf '%s' "$COMMENT" > "$RUNNER_TEMP/comment.txt"
          python -m content.salarycomment --title "$TITLE" --body-file "$RUNNER_TEMP/body.txt" --comment-file "$RUNNER_TEMP/comment.txt" | tee "$RUNNER_TEMP/salary.txt" || true
      - name: 연봉표 저장 (salaries.yaml 커밋)
        if: steps.s.outputs.added == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/salaries.yaml
          git diff --cached --quiet && exit 0
          git commit -m "확인 연봉표에 ${{ steps.s.outputs.name }} 추가 (대표 제공, 추정)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: 알림 (쓰는 중 / 금액 못 읽음)
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          NAME: ${{ steps.s.outputs.name }}
          ADDED: ${{ steps.s.outputs.added }}
        run: |
          if [ "$ADDED" = "1" ]; then
            msg="$NAME 연봉을 받았어요(추정치로 표시). 지금 글·클립·쇼츠를 쓰는 중이에요 (15~20분). 다 되면 이 이슈에 알려드려요."
          else
            msg="$(cat "$RUNNER_TEMP/salary.txt" 2>/dev/null || echo '금액을 못 읽었어요. 예: 연봉 5억 또는 주급 2천만원')"
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$msg"

  salary-write:
    needs: salary
    if: needs.salary.outputs.added == '1'
    uses: ./.github/workflows/daily-post.yml
    with:
      mode: 실제
      again: true
      topic: ${{ needs.salary.outputs.name }}
      theme: life
      event: ${{ needs.salary.outputs.event }}
      team: ${{ needs.salary.outputs.team }}
      trend: true
    secrets: inherit

  salary-report:   # 다시 쓰기 결과 알림 (성공/실패)
    needs: [salary, salary-write]
    if: always() && needs.salary.outputs.added == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # salary-write가 올린 글까지
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 결과 확인·알림
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          NAME: ${{ needs.salary.outputs.name }}
        run: |
          made=$(python -m content.designate --check "$NAME")
          if [ "$made" = "made" ]; then
            msg="✅ $NAME 글이 올라왔어요(연봉은 추정치·공식 발표 아님으로 표시). 발행 도우미 위쪽에서 블로그·클립·쇼츠를 확인하세요."
          else
            msg="⚠️ 연봉은 넣었는데 글이 안 나왔어요. 올 시즌 기록(경기·골 등)을 뉴스에서 못 찾았을 수 있어요. 소속팀을 댓글에 '소속: 팀이름'으로 적어 주시면 다시 해볼게요."
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$msg"

  edit:   # 글 화면 '고친 내용 저장': 대표가 고친 제목·문단을 글에 반영
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[수정]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 반영
        env:
          TITLE: ${{ github.event.issue.title }}   # 제목·본문은 셸에 직접 넣지 않고 환경 변수로만
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/edit.txt"
          python -m content.edits --title "$TITLE" --body-file "$RUNNER_TEMP/edit.txt" | tee "$RUNNER_TEMP/result.txt"
      - name: 저장 (posts/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet && exit 0
          git commit -m "발행 도우미: 대표 수정 반영"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: 이슈 닫기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ job.status }}
        run: |
          if [ "$OK" = "success" ]; then msg="$(cat "$RUNNER_TEMP/result.txt"). 2~3분 뒤 발행 도우미에 보여요."
          else msg="반영하지 못했어요. 이 화면을 Claude에게 알려주세요."; fi
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$msg"

  edit-desk:
    needs: edit
    uses: ./.github/workflows/desk.yml
    secrets: inherit

  tool:   # 도우미 첫 화면 버튼: 이슈를 닫고 알맞은 워크플로를 부른다
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[다시그리기]') || startsWith(github.event.issue.title, '[새후보]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 이슈 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          case "$TITLE" in
            "[다시그리기]"*) msg="사진·썸네일·클립을 다시 그리는 중이에요. 5~10분 뒤 발행 도우미에서 보여요." ;;
            *) msg="후보 4편을 새로 쓰는 중이에요. 20~30분 뒤 발행 도우미에 올라와요." ;;
          esac
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$msg"

  redraw:
    needs: tool
    if: startsWith(github.event.issue.title, '[다시그리기]')
    uses: ./.github/workflows/rebuild-images.yml
    secrets: inherit

  fresh:
    needs: tool
    if: startsWith(github.event.issue.title, '[새후보]')
    uses: ./.github/workflows/daily-post.yml
    with:
      mode: 실제
      again: true
      count: "all"
    secrets: inherit

  discard:   # 쇼츠 모음 '이 쇼츠는 안 올리고 버리기'
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[쇼츠버림]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 영상 받기 (영상은 저장소가 아니라 캐시에 둔다, 2026-09-30)
        uses: actions/cache/restore@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-r
          restore-keys: media-
      - name: 버리기
        env:
          TITLE: ${{ github.event.issue.title }}   # 셸에 직접 넣지 않고 환경 변수로만
        run: |
          NAME=$(printf '%s' "$TITLE" | sed -E 's/^\[쇼츠버림\][[:space:]]*//')
          printf '%s' "$NAME" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[ABC]-[^/[:space:]]+$' || { echo "형식이 다름"; exit 1; }
          python -m content.shorts --discard "$NAME"
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shorts/
          git diff --cached --quiet && exit 0
          git commit -m "쇼츠 버림"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: 캐시 표시
        if: always()
        run: mkdir -p .cache && date > .cache/media.txt
      - name: 영상 캐시 저장
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: 이슈 닫기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "버렸어요. 그 형식은 다음 날 아침 새로 만들어져요."

  discard-desk:
    needs: discard
    uses: ./.github/workflows/desk.yml
    secrets: inherit
