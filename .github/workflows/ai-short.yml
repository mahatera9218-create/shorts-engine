# 조선 화풍 AI 쇼츠 시험 (A: 그림+움직임, B: 힉스필드 클링) + 블로그 이름 겹침 점검 → reports/쇼츠-시안/, reports/브랜드/
# 자동: content/ai_short.py, config/ai_short_run.yaml, config/blog_names.yaml을 고쳐 main에 올리면.
name: AI 쇼츠 시험

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/ai_short.py", "config/ai_short_run.yaml", "config/blog_names.yaml", "market/name_check.py"]

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-nanum-extra ffmpeg > /dev/null
          pip install -r requirements.txt higgsfield-client
      - name: 블로그 이름 점검
        env:
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: python -m market.name_check || true
      - name: 쇼츠 만들기
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_API_SECRET: ${{ secrets.HF_API_SECRET }}
        run: python -m content.ai_short
      - name: 결과 저장 (reports/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git add -f reports/쇼츠-시안/ 2>/dev/null || true  # mp4는 .gitignore라 시안만 강제로 올린다
          git diff --cached --quiet && exit 0
          git commit -m "AI 쇼츠 시험 $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
