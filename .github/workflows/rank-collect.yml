# 순위 '호응도' 주간 수집 — Grok 웹검색으로 각 서비스 최근 반응을 점수화해 순위 JSON 갱신
# - 매주 1회 자동. web/content/rankings/*.json의 buzz(호응도)만 갱신해 main에 커밋 → Vercel 배포.
# - 비밀값 XAI_API_KEY 필요. 없거나 응답 없으면 기존 값 유지(안전).
name: 순위 호응도 주간 수집

on:
  workflow_dispatch:
  schedule:
    - cron: "23 22 * * 0"   # 매주 월요일 KST 07:23

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 호응도 수집
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -o pipefail
          python -m content.rank_collect | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/rankings
          if git diff --cached --quiet; then
            echo "호응도 변경 없음 — 커밋 생략." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git commit -m "순위 호응도 주간 갱신 ($(date +%F))"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main \
              && { echo "✅ 호응도 반영." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep $((i * 3))
          done
          exit 1
