# 순위 자동 지표 주간 수집 — 네이버 검색광고·데이터랩·앱스토어 평점(출처 있는 공개 지표)으로 순위 JSON 갱신(Grok 추정 점수는 중단)
# - 매주 1회 자동. 앱의 metrics 설정이 있는 순위 JSON의 자동 항목(인지도·관심도·평점)과 근거를 갱신해 main에 커밋 → Vercel 배포.
# - 네이버 키(NAVER_AD_*, NCP_APIGW_*)가 없거나 API 오류면 기존 값 유지(안전). 수수료·표시광고는 사람이 근거 링크와 함께 입력.
name: 순위 자동 지표 주간 수집

on:
  workflow_dispatch:
  schedule:
    - cron: "23 22 * * 0"   # 매주 월요일 KST 07:23

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 자동 지표 수집(네이버 검색광고·데이터랩·앱스토어 평점)
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: |
          set -o pipefail
          python -m content.rank_metrics | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 순위 데이터 검증(공개 게이트)
        run: python -m content.rank_verify | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/rankings
          if git diff --cached --quiet; then
            echo "호응도 변경 없음 — 커밋 생략." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git commit -m "순위 호응도 주간 갱신 ($(date +%F))"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main \
              && { echo "✅ 호응도 반영." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep $((i * 3))
          done
          exit 1
