# Threads 자동 게시 — 새 글을 하나씩 Threads에 올린다(소량·공식 API)
# - 매 실행 1편. 하루 3회 cron = 소량(봇 티·도달 저하 방지). 토큰 없으면 조용히 생략.
# - 올린 글은 reports/threads-posted.json에 기록해 중복 방지.
name: Threads 자동 게시

on:
  workflow_dispatch:
  # 자동 스케줄 끔(2026-10-17 대표 지시, Threads 보류). 토큰 발급 후 아래 주석을 풀면 다시 돈다.
  # schedule:
  #   - cron: "12 0 * * *"    # KST 09:12
  #   - cron: "22 4 * * *"    # KST 13:22
  #   - cron: "8 11 * * *"    # KST 20:08

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          python -m content.threads_post | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/threads-posted.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "게시 없음 — 기록 변경 없음." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git commit -m "Threads 게시 기록 ($(date +%F))"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
