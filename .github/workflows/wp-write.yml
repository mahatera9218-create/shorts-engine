# 구글 글 자동 작성기 (큐를 계속 채운다 — 대표 중단 요청 전까지)
# - 매일 새 글 몇 편을 생성해 reports/구글글-초안/에 커밋한다. 드립 발행기가 이 큐를 소진.
# - 키: ANTHROPIC_API_KEY (GitHub Secrets). 끄려면 이 워크플로를 비활성화.
name: 구글 글 자동 작성

on:
  workflow_dispatch:
    inputs:
      count:
        description: "생성할 편수"
        type: string
        default: "3"
  # 자동 스케줄 끔(2026-10-16): API 키 없이 클로드 예약 작업이 매일 새벽 초안 3편을 저장한다.
  # API 키를 다시 쓸 때만 아래 schedule을 되살린다.
  # schedule:
  #   - cron: "11 21 * * *"   # KST 06:11

permissions:
  contents: write

concurrency:
  group: wp-write
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 글 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m content.wp_write --count "${{ inputs.count || 3 }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 큐에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/구글글-초안/ reports/costs.csv config/google_topics.yaml
          if git diff --cached --quiet; then
            echo "새로 생성된 글 없음" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "구글 글 자동 생성 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            echo "글을 저장하지 못했습니다. Claude에게 알려주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
