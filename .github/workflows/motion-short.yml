# 조선 화풍 모션그래픽 쇼츠 (AI 영상 없이 코드로 움직임) → reports/쇼츠-시안/금값-출렁/M-모션그래픽.mp4
# 자동: content/motion_short.py를 고쳐 main에 올리면. 수동: Actions → 모션그래픽 쇼츠
name: 모션그래픽 쇼츠

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/motion_short.py"]

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum ffmpeg > /dev/null
          pip install -r requirements.txt
      - name: 재료 그리기 + 영상 만들기
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m content.motion_short
      - name: 결과 저장 (reports/ 커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git add -f reports/쇼츠-시안/ 2>/dev/null || true  # mp4는 .gitignore라 시안만 강제로 올린다
          git diff --cached --quiet && exit 0
          git commit -m "모션그래픽 쇼츠 $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
