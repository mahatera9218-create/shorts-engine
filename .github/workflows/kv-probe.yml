# KV 권한 확인용 (접수함 만들기 전 1회 점검) — 대표 2026-10-18
# CLOUDFLARE_API_TOKEN이 Workers KV 권한을 갖고 있는지 확인한다. 끝나면 지울 워크플로.
name: KV 권한 점검
on:
  push:
    paths:
      - ".github/workflows/kv-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: KV 접근 시도
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ 클플 키가 없음" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          ACC=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -1 || true)
          echo "::add-mask::$ACC"
          export CLOUDFLARE_ACCOUNT_ID="$ACC"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "## KV 권한 점검 결과" >> "$GITHUB_STEP_SUMMARY"
          if npx --yes wrangler@4 kv namespace list > kvlist.txt 2>&1; then
            echo "✅ KV 목록 조회 성공 (KV 권한 있음)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; cat kvlist.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ KV 목록 조회 실패 — 토큰에 Workers KV 권한이 없을 수 있음" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; cat kvlist.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
