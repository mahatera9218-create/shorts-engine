# 그림 창고: config/art_library.yaml의 장면 중 없는 것만 고화질로 그려 assets/art-library/에 쌓는다
# 자동: config/art_library_run.yaml(실행 스위치)이나 config/art_library.yaml을 고쳐 main에 올리면
name: 그림 창고

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/art_library_run.yaml", "config/art_library.yaml"]

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 스위치 확인
        id: sw
        run: echo "run=$(python -c "import yaml;print(yaml.safe_load(open('config/art_library_run.yaml'))['run'])")" >> "$GITHUB_OUTPUT"
      - name: 그리기 (고화질, 없는 것만)
        if: steps.sw.outputs.run != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m content.art_library | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art-library/
          git diff --cached --quiet && exit 0
          git commit -m "그림 창고 $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
