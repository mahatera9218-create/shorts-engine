# 자동 글쓰기 (하루 1편): 뉴스 수집 → Claude 숫자 뽑기 → 코드 계산·그래픽 → Claude 글쓰기 → 코드 검사 → posts/에 저장
# - 자동 실행: 매일 오전 6시 47분 (한국 시간). 결과는 posts/README.md 목록에 올라온다.
# - 수동 실행: Actions → 자동 글쓰기 → Run workflow (선수 이름을 넣으면 그 선수로 바로 씀)
# - 발행은 운영자가 한다 (네이버 블로그는 글쓰기 API가 없음).
name: 자동 글쓰기

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식 (실제 = Claude·네이버 키 필요, 예시 = 키 없이 모양만 확인)"
        type: choice
        options: [실제, 예시]
        default: 실제
      topic:
        description: "선수 이름 (비우면 대기열 순서대로)"
        type: string
        required: false
  schedule:
    - cron: "47 21 * * *"   # UTC 21:47 = 한국 다음 날 06:47

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum > /dev/null
          pip install -r requirements.txt
      - name: 글쓰기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: |
          if [ "${{ inputs.mode }}" = "예시" ]; then
            python -m content.autopost --sample --out "$RUNNER_TEMP/예시"
          elif [ -n "$TOPIC" ]; then
            python -m content.autopost --topic "$TOPIC"
          else
            python -m content.autopost
          fi
      - name: 결과 저장 (posts/ 커밋)
        if: inputs.mode != '예시'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "새 글 없음"
          else
            git commit -m "자동 글쓰기 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            echo "결과를 저장하지 못했습니다. Claude에게 알려주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
