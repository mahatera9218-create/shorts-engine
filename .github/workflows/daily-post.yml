# 자동 글쓰기: 마케터 3명이 동시에 1편씩 (2026-10-01, config/marketers.yaml)
#   준비(화제 선수·발행 확인) → 마케터 1·2·3 동시에 글쓰기(뉴스 → Claude 숫자 뽑기 → 코드 계산·그래픽 → Claude 글쓰기 → 검사 → 클립)
#   → 모으기(글 합치기·쇼츠 3개·저장) → 발행 도우미
# - 자동 실행: 매일 오전 5시 13분 (예비 7시 37분, 한국 시간). GitHub가 늦게 시작할 때가 있어 두 번 걸어 둔다.
#   예비 실행은 마케터마다 오늘 글이 이미 있으면 더 쓰지 않는다.
# - 수동 실행: Actions → 자동 글쓰기 → Run workflow (선수 이름을 넣으면 오늘 차례 마케터가 그 선수로 씀)
# - 발행은 운영자가 한다 (네이버 블로그는 글쓰기 API가 없음).
# - 발행 도우미 버튼: "다시 뽑기"는 버린 글의 마케터가 1편, "후보 새로 쓰기"는 3명이 1편씩 (desk-button.yml).
name: 자동 글쓰기

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식 (실제 = Claude·네이버 키 필요, 예시 = 키 없이 모양만 확인)"
        type: choice
        options: [실제, 예시]
        default: 실제
      topic:
        description: "선수 이름 (비우면 마케터 3명이 각자 고름)"
        type: string
        required: false
      theme:
        description: "테마 (비우면 마케터 전략대로)"
        type: choice
        options: ["", receipt, same, cross, life, tax, place, trip, jersey, rank]
        default: ""
      marketer:
        description: "마케터 번호만 (비우면 3명 모두)"
        type: string
        required: false
  workflow_call:   # 발행 도우미 버튼 (desk-button.yml)
    inputs:
      mode: {type: string, default: 실제}
      again: {type: boolean, default: false}
      count: {type: string, default: "1"}      # 예전 입력 (1 = 한 마케터, 그 밖 = 모두)
      marketer: {type: string, default: ""}    # 다시 뽑기: 버린 글의 마케터
      topic: {type: string, default: ""}       # 대표 지정 선수 (도우미 '이 선수로 지금 쓰기', 2026-10-03)
      theme: {type: string, default: ""}       # 테마 고정 (지정 글은 receipt)
      event: {type: string, default: ""}       # 지정 선수의 오늘 사건 한 줄 (첫 문단 훅)
      trend: {type: boolean, default: false}   # 생활 물가 비교를 당일 검색량 상위 상품으로
      team: {type: string, default: ""}        # 지정 선수 소속 (종목·동명이인 판별)
  push:       # 지금 쓰기 (2026-10-02): GitHub 예약이 안 돌면 config/write_now.yaml을 바꿔 올려 3명 모두 쓰게 한다
    branches: [main]
    paths: ["config/write_now.yaml"]
  schedule:   # GitHub 예약 실행은 몇 시간씩 늦게 시작할 때가 있다 (9/30은 06:47 예약이 09:45에 시작, 10/1은 07시까지 시작 안 함)
    - cron: "13 20 * * *"   # UTC 20:13 = 한국 05:13 (일찍 걸어 둔다)
    - cron: "37 22 * * *"   # UTC 22:37 = 한국 07:37 예비

permissions:
  contents: write
  actions: read

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 예시 (키 없이 모양만)
        if: inputs.mode == '예시'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum ffmpeg > /dev/null
          python -m content.autopost --sample --marketer 1 --out "$RUNNER_TEMP/예시"
      - name: 화제 선수·검색량 (실패해도 글쓰기는 계속)
        if: inputs.mode != '예시' && !inputs.again
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: python -m content.trending | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 발행 확인 (네이버 블로그 RSS, 실패해도 글쓰기는 계속)
        if: inputs.mode != '예시' && !inputs.again
        continue-on-error: true
        run: python -m content.published | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 저장 (마케터들이 같은 화제 선수·발행 표시를 보게)
        if: inputs.mode != '예시' && !inputs.again
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts/
          for f in config/trending.yaml config/search_volume.yaml; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "자동 글쓰기 준비 $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: 마케터 정하기
        id: m
        env:
          ONE: ${{ inputs.marketer }}
          COUNT: ${{ inputs.count }}
          TOPIC: ${{ inputs.topic }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import date
          from content import marketers
          one, count, topic = (os.environ.get(k, "").strip() for k in ("ONE", "COUNT", "TOPIC"))
          if os.environ.get("MODE") == "예시":
              ms = []
          elif one:
              ms = [int(one)]
          elif topic or count == "1":
              ms = [marketers.turn(date.today().isoformat())]
          else:
              ms = marketers.ids()
          print("matrix=" + json.dumps(ms))
          PY
          cat "$GITHUB_OUTPUT"

  write:
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        marketer: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 준비 단계가 올린 화제 선수까지
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-nanum-extra ffmpeg > /dev/null
          pip install -r requirements.txt
      - name: 글쓰기 (마케터 ${{ matrix.marketer }})
        timeout-minutes: 55
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          THEME: ${{ inputs.theme }}
          EVENT: ${{ inputs.event }}
          PTEAM: ${{ inputs.team }}
          AUTOPOST_SKIP: ${{ runner.temp }}/skip.json   # 여러 번 시도할 때 이미 실패한 선수는 다시 모으지 않음
        run: |
          args=(--marketer "${{ matrix.marketer }}" --target 1 --tries 2)   # 2번 안에 못 쓰면 그 마케터는 오늘 쉰다 (비용 효율)
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          [ -n "$THEME" ] && args+=(--theme "$THEME")
          [ -n "$EVENT" ] && args+=(--event "$EVENT")
          [ -n "$PTEAM" ] && args+=(--team "$PTEAM")
          [ "${{ inputs.trend }}" = "true" ] && args+=(--trend)
          [ "${{ inputs.again }}" = "true" ] && args+=(--again)
          python -m content.autopost "${args[@]}"
      - name: 결과 넘기기 준비 (오늘 글 폴더와 같이 고치는 장부만)
        if: always()
        run: |
          mkdir -p out/posts out/config out/reports
          cp -r posts/"$(date +%F)"-* out/posts/ 2>/dev/null || true
          for f in config/skip_players.yaml config/player_photos.yaml; do [ -e "$f" ] && cp "$f" out/config/; done
          [ -e reports/costs.csv ] && cp reports/costs.csv out/reports/
          date > out/marketer-${{ matrix.marketer }}.txt
          ls out/posts
      - name: 결과 넘기기 (모으기 단계로)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ matrix.marketer }}
          path: out/
          if-no-files-found: ignore
          retention-days: 3

  collect:
    needs: [prepare, write]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-nanum-extra ffmpeg > /dev/null
          pip install -r requirements.txt
      - name: 영상 받기 (영상은 저장소가 아니라 캐시에 둔다, 2026-09-30)
        uses: actions/cache/restore@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-r
          restore-keys: media-
      - name: 마케터 결과 받기
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: post-*
          path: ${{ runner.temp }}/arts
      - name: 모으기 (마케터 글 합치기·글 목록)
        run: |
          args=("$RUNNER_TEMP/arts")
          [ "${{ inputs.again }}" = "true" ] && args+=(--again)
          python -m content.collect "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 쇼츠 성과 수집 (우리 채널 공개 통계, 실패해도 계속)
        if: ${{ !inputs.again }}
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m content.shorts_stats | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 유튜브 쇼츠 (글마다 그 주제로, 코드 계산만. 지금 쓰기에서도 돈다, 2026-10-03)
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python -m content.shorts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 저장 (posts/ 커밋)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts/; [ -d shorts ] && git add -A shorts/; for f in config/trending.yaml config/search_volume.yaml config/player_photos.yaml config/skip_players.yaml reports/costs.csv reports/쇼츠-성과; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "새 글 없음"
          else
            git commit -m "자동 글쓰기 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
              sleep $((i * 5))
            done
            echo "결과를 저장하지 못했습니다. Claude에게 알려주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: 캐시 표시
        if: always()
        run: mkdir -p .cache && date > .cache/media.txt
      - name: 새 영상 넘기기 (같은 실행의 도우미 배포용. 버튼으로 돈 실행은 캐시 저장이 막힐 때가 있다, 2026-10-01)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: media-new
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: 영상 캐시 저장
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  desk:
    needs: collect
    if: ${{ always() && needs.collect.result != 'skipped' }}   # 일부만 써도 도우미에 올린다
    uses: ./.github/workflows/desk.yml
    secrets: inherit
