# 자동 글쓰기 (하루 1편): 뉴스 수집 → Claude 숫자 뽑기 → 코드 계산·그래픽 → Claude 글쓰기 → 코드 검사 → posts/에 저장
# - 자동 실행: 매일 오전 5시 13분 (예비 7시 37분, 한국 시간). GitHub가 늦게 시작할 때가 있어 두 번 걸어 둔다. 결과는 posts/README.md 목록에 올라온다.
# - 수동 실행: Actions → 자동 글쓰기 → Run workflow (선수 이름을 넣으면 그 선수로 바로 씀)
# - 발행은 운영자가 한다 (네이버 블로그는 글쓰기 API가 없음).
# - 발행 도우미의 "다시 뽑기"는 desk-button.yml이 이 워크플로를 --again으로 부른다.
name: 자동 글쓰기

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식 (실제 = Claude·네이버 키 필요, 예시 = 키 없이 모양만 확인)"
        type: choice
        options: [실제, 예시]
        default: 실제
      topic:
        description: "선수 이름 (비우면 선수 풀에서 무작위)"
        type: string
        required: false
      theme:
        description: "테마 (비우면 무작위)"
        type: choice
        options: ["", receipt, same, cross, life]
        default: ""
      count:
        description: "후보 몇 편 (1~5, 기본 4). 기준 미달은 알아서 다시 씀. 대표가 1편 골라 발행"
        type: choice
        options: ["1", "2", "3", "4", "5"]
        default: "4"
  workflow_call:   # 발행 도우미 버튼 "다시 뽑기"·"후보 새로 쓰기" (desk-button.yml)
    inputs:
      mode: {type: string, default: 실제}
      again: {type: boolean, default: false}
      count: {type: string, default: "1"}   # 다시 뽑기 = 1편, 도우미 "후보 새로 쓰기" = 4편
  schedule:   # GitHub 예약 실행은 몇 시간씩 늦게 시작할 때가 있다 (9/30은 06:47 예약이 09:45에 시작, 10/1은 07시까지 시작 안 함)
    - cron: "13 20 * * *"   # UTC 20:13 = 한국 05:13 (일찍 걸어 둔다)
    - cron: "37 22 * * *"   # UTC 22:37 = 한국 07:37 예비: 앞 실행이 이미 썼으면 하루 한도에 걸려 글을 더 쓰지 않는다

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-nanum-extra ffmpeg > /dev/null
          pip install -r requirements.txt
      - name: 영상 받기 (영상은 저장소가 아니라 캐시에 둔다, 2026-09-30)
        uses: actions/cache/restore@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-r
          restore-keys: media-
      - name: 화제 선수·검색량 (실패해도 글쓰기는 계속)
        if: inputs.mode != '예시'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: python -m content.trending | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 발행 확인 (네이버 블로그 RSS, 실패해도 글쓰기는 계속)
        if: inputs.mode != '예시'
        continue-on-error: true
        run: python -m content.published | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 글쓰기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}   # 클립 AI 목소리 (없으면 목소리 없이)
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          AUTOPOST_SKIP: ${{ runner.temp }}/skip.json   # 여러 편일 때 이미 실패한 선수는 다시 모으지 않음
          THEME: ${{ inputs.theme }}
        run: |
          if [ "${{ inputs.mode }}" = "예시" ]; then
            python -m content.autopost --sample --out "$RUNNER_TEMP/예시"
          else
            args=()
            [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
            [ -n "$THEME" ] && args+=(--theme "$THEME")
            [ "${{ inputs.again }}" = "true" ] && args+=(--again)
            n="${{ inputs.count }}"; n="${n:-4}"   # 매일 후보 4편 (대표가 1편 골라 발행)
            # 발행 가능(✅) 글이 n편 될 때까지 최대 n×3+1번 쓴다. 기준 미달(⚠️)은 목록에서 빼고 다른 조합으로 다시.
            python -m content.autopost "${args[@]}" --target "$n" --tries $((n * 3 + 1))
          fi
      - name: 쇼츠 성과 수집 (우리 채널 공개 통계, 실패해도 계속)
        if: inputs.mode != '예시' && !inputs.again
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m content.shorts_stats | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 유튜브 쇼츠 A·B·C (코드 계산만, Claude 비용 없음. 실패해도 글은 저장)
        if: inputs.mode != '예시' && !inputs.again
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python -m content.shorts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 저장 (posts/ 커밋)
        if: inputs.mode != '예시'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts/; [ -d shorts ] && git add -A shorts/; for f in config/trending.yaml config/search_volume.yaml config/player_photos.yaml config/skip_players.yaml reports/costs.csv reports/쇼츠-성과; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "새 글 없음"
          else
            git commit -m "자동 글쓰기 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            echo "결과를 저장하지 못했습니다. Claude에게 알려주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: 캐시 표시
        if: always()
        run: mkdir -p .cache && date > .cache/media.txt
      - name: 영상 캐시 저장
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            posts/*/clip.mp4
            shorts/*/video.mp4
            .cache/media.txt
          key: media-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  desk:
    needs: write
    if: ${{ always() && needs.write.result == 'success' }}
    uses: ./.github/workflows/desk.yml
    secrets: inherit
