# 자동 글쓰기 (하루 1편): 뉴스 수집 → Claude 숫자 뽑기 → 코드 계산·그래픽 → Claude 글쓰기 → 코드 검사 → posts/에 저장
# - 자동 실행: 매일 오전 6시 47분 (한국 시간). 결과는 posts/README.md 목록에 올라온다.
# - 수동 실행: Actions → 자동 글쓰기 → Run workflow (선수 이름을 넣으면 그 선수로 바로 씀)
# - 발행은 운영자가 한다 (네이버 블로그는 글쓰기 API가 없음).
# - 발행 도우미의 "다시 뽑기"는 desk-button.yml이 이 워크플로를 --again으로 부른다.
name: 자동 글쓰기

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식 (실제 = Claude·네이버 키 필요, 예시 = 키 없이 모양만 확인)"
        type: choice
        options: [실제, 예시]
        default: 실제
      topic:
        description: "선수 이름 (비우면 선수 풀에서 무작위)"
        type: string
        required: false
      theme:
        description: "테마 (비우면 무작위)"
        type: choice
        options: ["", receipt, same, cross, life]
        default: ""
      count:
        description: "몇 편 (1~5). 2편 이상이면 오늘 한도를 넘겨 서로 다른 선수·테마로 씀"
        type: choice
        options: ["1", "2", "3", "4", "5"]
        default: "1"
  workflow_call:   # 발행 도우미 "다시 뽑기" (desk-button.yml)
    inputs:
      mode: {type: string, default: 실제}
      again: {type: boolean, default: false}
  schedule:
    - cron: "47 21 * * *"   # UTC 21:47 = 한국 다음 날 06:47

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum fonts-nanum-extra ffmpeg > /dev/null
          pip install -r requirements.txt
      - name: 글쓰기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          AUTOPOST_SKIP: ${{ runner.temp }}/skip.json   # 여러 편일 때 이미 실패한 선수는 다시 모으지 않음
          THEME: ${{ inputs.theme }}
        run: |
          if [ "${{ inputs.mode }}" = "예시" ]; then
            python -m content.autopost --sample --out "$RUNNER_TEMP/예시"
          else
            args=()
            [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
            [ -n "$THEME" ] && args+=(--theme "$THEME")
            [ "${{ inputs.again }}" = "true" ] && args+=(--again)
            n="${{ inputs.count }}"; n="${n:-1}"
            python -m content.autopost "${args[@]}"
            for i in $(seq 2 "$n"); do   # 2편째부터는 한도 예외 (앞 글의 선수는 최근 목록에 있어 제외된다)
              python -m content.autopost "${args[@]}" --again
            done
          fi
      - name: 결과 저장 (posts/ 커밋)
        if: inputs.mode != '예시'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "새 글 없음"
          else
            git commit -m "자동 글쓰기 $(date +%F)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((i * 5))
            done
            echo "결과를 저장하지 못했습니다. Claude에게 알려주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  desk:
    needs: write
    if: ${{ always() && needs.write.result == 'success' }}
    uses: ./.github/workflows/desk.yml
    secrets: inherit
