# 머리 바꾸기 시험 (실존 인물 캐리커처·마스코트) → reports/쇼츠-시안/머리바꾸기/
# 자동: content/head_swap.py를 고쳐 main에 올리면
name: 머리 바꾸기 시험

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/head_swap.py"]

permissions:
  contents: write

concurrency:
  group: repo-reports
  cancel-in-progress: false

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 머리 바꾸기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m content.head_swap | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "머리 바꾸기 시험 $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
