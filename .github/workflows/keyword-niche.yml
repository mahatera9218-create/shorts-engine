# 틈새 키워드 조사 — 네이버 검색광고 API(월 검색량 PC·모바일) + API HUB 블로그 검색(문서수)로
# 증시·부동산 씨앗의 경쟁강도·틈새를 재서 reports/검색량/틈새-<날짜>.md에 커밋.
# - 금·환율은 고정이라 조사 안 함(config/niche_keywords.yaml). 씨앗은 대표가 그 파일에서 바꾼다.
# - 필요한 Secrets(5): NAVER_AD_API_KEY · NAVER_AD_SECRET_KEY · NAVER_AD_CUSTOMER_ID · NCP_APIGW_API_KEY_ID · NCP_APIGW_API_KEY
name: 틈새 키워드 조사

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["market/niche.py", "config/niche_keywords.yaml", ".github/workflows/keyword-niche.yml"]
  schedule:
    - cron: "0 19 * * *"   # KST 매일 04:00 (대표 2026-11-01, 어사이드 05:00보다 1시간 앞 → 같은 날 틈새표)

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 틈새 키워드 조사
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: |
          set -o pipefail
          python -m market.niche | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 결과 저장 (전용 브랜치 niche-results — 바쁜 main과 레이스 회피)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 결과를 전용 브랜치 niche-results에 누적 커밋한다. 이 브랜치는 이 잡만 쓰므로
          # main의 드립 발행과 충돌하지 않는다(main 푸시가 레이스로 실패했던 걸 고침).
          DIR="reports/검색량"
          TMP=$(mktemp -d)
          cp -a "$DIR"/. "$TMP"/ 2>/dev/null || true         # 이번 결과 임시 보관
          git fetch origin niche-results 2>/dev/null || true
          if git rev-parse --verify origin/niche-results >/dev/null 2>&1; then
            git checkout -f -B niche-results origin/niche-results   # 지난 결과 위에 누적
          else
            git checkout -f -B niche-results                        # 처음엔 현재(main) 기반
          fi
          mkdir -p "$DIR"
          cp -a "$TMP"/. "$DIR"/                              # 이번 결과 복원(같은 날 재실행도 OK)
          git add "$DIR" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git commit -m "틈새 키워드 조사 ($(date +%F))"
          for i in 1 2 3 4; do
            git push origin HEAD:niche-results && exit 0
            sleep $((i * 2))
          done
          exit 1
