# 틈새 키워드 조사 — 네이버 검색광고 API(월 검색량 PC·모바일) + API HUB 블로그 검색(문서수)로
# 증시·부동산 씨앗의 경쟁강도·틈새를 재서 reports/검색량/틈새-<날짜>.md에 커밋.
# - 금·환율은 고정이라 조사 안 함(config/niche_keywords.yaml). 씨앗은 대표가 그 파일에서 바꾼다.
# - 필요한 Secrets(5): NAVER_AD_API_KEY · NAVER_AD_SECRET_KEY · NAVER_AD_CUSTOMER_ID · NCP_APIGW_API_KEY_ID · NCP_APIGW_API_KEY
name: 틈새 키워드 조사

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["market/niche.py", "config/niche_keywords.yaml", ".github/workflows/keyword-niche.yml"]
  schedule:
    - cron: "0 22 * * 0"   # KST 월요일 07:00 (주 1회)

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 준비
        run: pip install -r requirements.txt
      - name: 틈새 키워드 조사
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
        run: |
          set -o pipefail
          python -m market.niche | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reports/검색량" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git commit -m "틈새 키워드 조사 ($(date +%F))"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
